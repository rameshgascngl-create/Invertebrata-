name: Native API 34 UI acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - native/v193-compose-migration-20261008
      - native/r15-feeding-textbook-20261010

jobs:
  api34-native-ui-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native Compose UI tests on actual API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Use the same API 34 AOSP image as the proven N1.4 gate.
          # Google APIs Pixel Launcher ANR was captured in run 37762054797.
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-native-api34-tests.sh
      - name: Upload API 34 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-api34-n13-ui-evidence
          path: qa-evidence/
          if-no-files-found: warn
