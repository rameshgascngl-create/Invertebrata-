name: Unit I PNG Android rendering acceptance
on:
  push:
    branches: [native/u56-gallery-touch-zoom-20261018]
    paths:
      - .github/workflows/unit1-png-android-qa.yml
      - native-app/app/src/main/assets/unit1/references/**
      - native-app/app/src/main/java/com/gasczoology/invertebratelab/ui/UnitIStageAtlasCanvas.kt
      - native-app/app/src/androidTest/java/com/gasczoology/invertebratelab/NativeUnitIProtozoaReferenceTest.kt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-png-and-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify all four PNG signatures, distinct bytes and provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          root=Path('native-app/app/src/main/assets/unit1/references')
          hashes=set()
          for name in ('entamoeba','trypanosoma','leishmania','plasmodium'):
            b=(root/(name+'.png')).read_bytes()
            assert b[:8]==bytes.fromhex('89504e470d0a1a0a'),name
            w,h=struct.unpack('>II',b[16:24])
            assert w>=450 and h>=250,(name,w,h)
            digest=hashlib.sha256(b).hexdigest()
            assert digest not in hashes,'Duplicate image: '+name
            hashes.add(digest)
            print(name,w,h,digest)
          p=(root/'SOURCE_PROVENANCE.txt').read_text()
          assert all(name in p for name in ('entamoeba','trypanosoma','leishmania','plasmodium'))
          print('UNIT1_FOUR_DISTINCT_PNG=PASS; ACADEMIC_REVIEW=PENDING')
          PY
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Unit I bitmap and bilingual gallery tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -eu
            mkdir -p qa-evidence/unit1-png
            for scale in 1.0 2.0; do
              adb shell settings put system font_scale "$scale"
              if ! gradle -p native-app :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=com.gasczoology.invertebratelab.NativeUnitIProtozoaReferenceTest" > "qa-evidence/unit1-png/gradle-$scale.txt" 2>&1; then
                tail -n 180 "qa-evidence/unit1-png/gradle-$scale.txt"
                cp -r native-app/app/build/outputs/androidTest-results/connected "qa-evidence/unit1-png/xml-$scale" || true
                exit 1
              fi
              cp -r native-app/app/build/outputs/androidTest-results/connected "qa-evidence/unit1-png/xml-$scale"
            done
            adb pull /sdcard/Download/u12-reference-qa qa-evidence/unit1-png/screenshots || true
      - name: Upload Android evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit1-png-android-evidence
          path: qa-evidence/unit1-png/
          if-no-files-found: warn
