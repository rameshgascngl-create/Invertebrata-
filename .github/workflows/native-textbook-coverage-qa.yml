name: Native textbook 43-chapter coverage QA

on:
  push:
    branches: [Unit-I]
    paths:
      - '.github/workflows/native-textbook-coverage-qa.yml'
      - 'native-app/app/src/main/java/com/gasczoology/invertebratelab/data/FiveUnitRestorationLessons.kt'
      - 'native-app/app/src/main/java/com/gasczoology/invertebratelab/data/NativeCurriculumManifest.kt'
      - 'native-app/app/src/main/java/com/gasczoology/invertebratelab/data/UnitIILessons.kt'
      - 'native-app/app/src/main/java/com/gasczoology/invertebratelab/data/UnitIIILessons.kt'
      - 'native-app/app/src/main/java/com/gasczoology/invertebratelab/data/UnitIVSupplementaryLessons.kt'
      - 'native-app/app/src/main/java/com/gasczoology/invertebratelab/ui/InvertebrataApp.kt'
      - 'native-app/app/src/test/java/com/gasczoology/invertebratelab/data/FiveUnitTextbookCoverageTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: textbook-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chapter-coverage-and-kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile native reader and run 43-chapter regression suite
        run: gradle -p native-app :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace
      - name: Package native debug QA APK
        run: gradle -p native-app :app:assembleDebug --stacktrace
      - name: Upload unapproved debug APK
        uses: actions/upload-artifact@v4
        with:
          name: native-textbook-43-chapter-UNAPPROVED-debug-apk
          path: native-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
