name: Native release size candidate (R8 + lossless WebP overlay, test-signed, NOT production)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/unit1-plates-and-parasite-slots
      - claude/ciliary-width-diagnostic

permissions:
  contents: read

jobs:
  release-size-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Baseline release build (R8, no overlay)
        run: |
          gradle -p native-app :app:assembleRelease --stacktrace
          mkdir -p qa-evidence/release-size
          cp native-app/app/build/outputs/apk/release/app-release-unsigned.apk qa-evidence/release-size/baseline-unsigned.apk
      - name: Lossless WebP overlay (source masters stay untouched in git)
        run: |
          pip install pillow
          python3 tools/optimise_plates.py --out build/optimised-assets
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          assets = Path("native-app/app/src/main/assets")
          opt = Path("build/optimised-assets")
          rows = json.load(open(opt / "optimisation-manifest.json"))["files"]
          swapped = 0
          for r in rows:
              if r["kept_original"]:
                  continue
              src = assets / r["source"]
              dst = assets / r["output"]
              assert not r["source"].startswith(("unit1/", "nereis/", "review_only/")), r["source"]
              if src.suffix.lower() != ".webp":
                  src.unlink()                      # never ship two formats for one stem
              shutil.copyfile(opt / r["output"], dst)
              swapped += 1
          print("OVERLAY_FILES_SWAPPED=%d" % swapped)
          PY
      - name: Release build with overlay, then test-sign (throwaway key; never a store key)
        run: |
          gradle -p native-app :app:assembleRelease --stacktrace
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)"
          OUT=qa-evidence/release-size
          cp native-app/app/build/outputs/apk/release/app-release-unsigned.apk "$OUT/overlay-unsigned.apk"
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storepass throwaway -keypass throwaway \
            -alias t -keyalg RSA -keysize 2048 -validity 30 -dname "CN=INVERTEBRATA test only"
          "$BT/zipalign" -p -f 4 "$OUT/overlay-unsigned.apk" "$OUT/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/throwaway.jks" --ks-pass pass:throwaway --key-pass pass:throwaway \
            --out "$OUT/INVERTEBRATA-1.9.0-RELEASE-TEST-SIGNED.apk" "$OUT/aligned.apk"
          rm -f "$OUT/aligned.apk" "$OUT/overlay-unsigned.apk.idsig" "$OUT"/*.idsig
          "$BT/apksigner" verify --verbose "$OUT/INVERTEBRATA-1.9.0-RELEASE-TEST-SIGNED.apk" | head -3
          "$BT/aapt" dump badging "$OUT/INVERTEBRATA-1.9.0-RELEASE-TEST-SIGNED.apk" > "$OUT/badging.txt"
          "$BT/aapt" dump permissions "$OUT/INVERTEBRATA-1.9.0-RELEASE-TEST-SIGNED.apk" > "$OUT/permissions.txt"
      - name: Verify release hygiene and report sizes
        run: |
          OUT=qa-evidence/release-size
          APK="$OUT/INVERTEBRATA-1.9.0-RELEASE-TEST-SIGNED.apk"
          grep -Fq "package: name='com.gasczoology.invertebratelab'" "$OUT/badging.txt"
          grep -Fq "versionCode='19000'" "$OUT/badging.txt"
          grep -Fq "versionName='1.9.0'" "$OUT/badging.txt"
          ! grep -Fq "application-debuggable" "$OUT/badging.txt"
          python3 - <<'PY'
          import zipfile, os, collections, json
          out = "qa-evidence/release-size"
          z = zipfile.ZipFile(out + "/INVERTEBRATA-1.9.0-RELEASE-TEST-SIGNED.apk")
          names = z.namelist()
          assert not any(n.startswith(("assets/review_only", "assets/paramecium/fission")) for n in names), "debug-only assets in release"
          stems = collections.defaultdict(list)
          for n in names:
              if n.startswith("assets/") and n.lower().endswith((".png", ".webp")):
                  stems[os.path.splitext(n)[0]].append(n)
          both = {k: v for k, v in stems.items() if len(v) > 1}
          assert not both, both
          base = os.path.getsize(out + "/baseline-unsigned.apk")
          cand = os.path.getsize(out + "/INVERTEBRATA-1.9.0-RELEASE-TEST-SIGNED.apk")
          rep = {"baseline_release_bytes": base, "overlay_release_bytes": cand,
                 "saved_percent": round(100 * (1 - cand / base), 1)}
          json.dump(rep, open(out + "/size-report.json", "w"), indent=1)
          print("RELEASE_SIZE_MB baseline=%.1f overlay=%.1f saved=%.1f%%" % (base / 1e6, cand / 1e6, rep["saved_percent"]))
          PY
          sha256sum "$APK" | tee "$OUT/APK-SHA256.txt"
          echo "TEST-SIGNED with a throwaway key; NOT production; academic review NOT approved." > "$OUT/WARNING.txt"
      - name: Upload candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-size-candidate-${{ github.sha }}
          path: |
            qa-evidence/release-size/INVERTEBRATA-1.9.0-RELEASE-TEST-SIGNED.apk
            qa-evidence/release-size/size-report.json
            qa-evidence/release-size/badging.txt
            qa-evidence/release-size/permissions.txt
            qa-evidence/release-size/APK-SHA256.txt
            qa-evidence/release-size/WARNING.txt
          if-no-files-found: error
          retention-days: 30
