name: Native release packaging candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-unsigned-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/undergraduate-coverage-register-20261114
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build release APK without debug signing or publishing
        run: gradle -p native-app :app:assembleRelease --stacktrace
      - name: Inspect release APK archive
        run: python3 tools/inspect_release_apk.py native-app/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload unsigned candidate for internal analysis only
        uses: actions/upload-artifact@v4
        with:
          name: invertebrata-UNSIGNED-release-candidate-${{ github.sha }}
          path: native-app/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
