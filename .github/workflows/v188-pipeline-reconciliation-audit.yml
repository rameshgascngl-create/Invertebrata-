name: INVERTEBRATA v1.8.8 Pipeline Reconciliation Audit

on:
  push:
    branches:
      - audit/v188-pipeline-reconciliation-step20-20260921
    paths:
      - .github/workflows/invertebrata-v188-debug.yml
      - .github/workflows/v188-pipeline-reconciliation-audit.yml
      - provenance/V188_BUILD_PIPELINE_RECONCILIATION_STEP20_01.md

permissions:
  contents: read

jobs:
  source-only-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HTML_SHA256: bdb39d4fa1f438c5de83fc9a84ab33905016854c1f641227dbc23063c14c2c46
      EXPECTED_HTML_SIZE: "2393951"
      EXPECTED_TREE_MANIFEST_SHA256: dbcf20925081e3ba67e3a2e4110f8c5fff619d237c262a8bd47d507de3358544
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Audit manual build workflow wiring
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          python - <<'PY' | tee "$RUNNER_TEMP/evidence/WORKFLOW_STATIC_AUDIT.txt"
          from pathlib import Path
          p=Path(".github/workflows/invertebrata-v188-debug.yml")
          s=p.read_text()
          assert "on:\n  workflow_dispatch:" in s
          trigger=s.split("permissions:",1)[0]
          assert "push:" not in trigger and "pull_request:" not in trigger
          assert s.count("reconstruct_v188_accepted_source.py reconstruct") == 2
          assert "reconstruct_v188_accepted_source.py preflight" in s
          assert "bdb39d4fa1f438c5de83fc9a84ab33905016854c1f641227dbc23063c14c2c46" in s
          assert "dbcf20925081e3ba67e3a2e4110f8c5fff619d237c262a8bd47d507de3358544" in s
          assert "ci/reconcile_r2.py" not in s
          assert "ci/reconcile_v188.py" not in s
          assert s.index("Authoritative source identity gate") < s.index("Set up Java 17")
          assert s.index("Authoritative source identity gate") < s.index("Build debug APK from accepted source")
          print("MANUAL_ONLY_BUILD_TRIGGER=PASS")
          print("MANIFEST_DRIVEN_RECONSTRUCTION=PASS")
          print("PARTIAL_R2_STEP2_PIPELINE_REMOVED=PASS")
          print("SOURCE_GATE_PRECEDES_GRADLE=PASS")
          print("AUDIT_GRADLE_INVOKED=NO")
          print("AUDIT_APK_GENERATED=NO")
          PY

      - name: Accepted-transform preflight
        shell: bash
        run: |
          set -euo pipefail
          python ci/reconstruct_v188_accepted_source.py preflight | tee "$RUNNER_TEMP/evidence/PREFLIGHT.txt"
          grep -Fx "PHASE_B1_PREFLIGHT=PASS" "$RUNNER_TEMP/evidence/PREFLIGHT.txt"
          grep -Fx "ACCEPTED_TRANSFORMS_AVAILABLE=20" "$RUNNER_TEMP/evidence/PREFLIGHT.txt"
          grep -Fx "SUPERSEDED_EXECUTABLE_TRANSFORMS=0" "$RUNNER_TEMP/evidence/PREFLIGHT.txt"
          grep -Fx "MATRIX_ROWS=76" "$RUNNER_TEMP/evidence/PREFLIGHT.txt"

      - name: Clean reconstruction Run A
        shell: bash
        run: |
          set -euo pipefail
          python ci/reconstruct_v188_accepted_source.py reconstruct \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/reconstruct-A" \
            --output "$RUNNER_TEMP/evidence/RUN_A.html" \
            | tee "$RUNNER_TEMP/evidence/RUN_A.log"

      - name: Clean reconstruction Run B
        shell: bash
        run: |
          set -euo pipefail
          python ci/reconstruct_v188_accepted_source.py reconstruct \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/reconstruct-B" \
            --output "$RUNNER_TEMP/evidence/RUN_B.html" \
            | tee "$RUNNER_TEMP/evidence/RUN_B.log"

      - name: Verify authoritative HTML and source-tree identity
        shell: bash
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/evidence/RUN_A.html" "$RUNNER_TEMP/evidence/RUN_B.html"
          test "$(sha256sum "$RUNNER_TEMP/evidence/RUN_A.html" | awk '{print $1}')" = "$EXPECTED_HTML_SHA256"
          test "$(stat -c %s "$RUNNER_TEMP/evidence/RUN_A.html")" = "$EXPECTED_HTML_SIZE"
          python - <<'PY' | tee "$RUNNER_TEMP/evidence/PIPELINE_RECONCILIATION_RESULT.txt"
          import hashlib, os
          from pathlib import Path
          rt=Path(os.environ["RUNNER_TEMP"])
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def tree_manifest(work):
              roots=[p for p in (Path(work)/"extracted").iterdir() if p.is_dir()]
              assert len(roots)==1
              root=roots[0]
              rows=[]
              for p in sorted(x for x in root.rglob("*") if x.is_file()):
                  rel=p.relative_to(root).as_posix()
                  rows.append((rel,p.stat().st_size,sha(p)))
              text="".join(f"{h}  {size}  {rel}\n" for rel,size,h in rows)
              return hashlib.sha256(text.encode()).hexdigest(),text,len(rows)
          ma,ta,na=tree_manifest(rt/"reconstruct-A")
          mb,tb,nb=tree_manifest(rt/"reconstruct-B")
          assert ma==mb==os.environ["EXPECTED_TREE_MANIFEST_SHA256"], (ma,mb)
          assert ta==tb
          (rt/"evidence/RUN_A_TREE_MANIFEST.txt").write_text(ta)
          (rt/"evidence/RUN_B_TREE_MANIFEST.txt").write_text(tb)
          print("AUTHORITATIVE_HTML_SHA256="+os.environ["EXPECTED_HTML_SHA256"])
          print("AUTHORITATIVE_HTML_SIZE="+os.environ["EXPECTED_HTML_SIZE"])
          print("SOURCE_TREE_MANIFEST_SHA256="+ma)
          print("SOURCE_TREE_FILE_COUNT="+str(na))
          print("ACCEPTED_TRANSFORMS_EXECUTED=20")
          print("SUPERSEDED_TRANSFORMS_EXECUTED=0")
          print("BYTE_IDENTICAL_RECONSTRUCTION=PASS")
          print("BUILD_PIPELINE_RECONCILIATION=PASS")
          print("GRADLE_INVOKED=NO")
          print("APK_GENERATED=NO")
          PY

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INVERTEBRATA-v1.8.8-PIPELINE-RECONCILIATION-AUDIT
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30
