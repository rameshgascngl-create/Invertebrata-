name: Publish INVERTEBRATA public privacy policy
on:
  workflow_dispatch:
  push:
    branches:
      - feat/native-textbook-reader-qa
    paths:
      - docs/privacy/**
      - .github/workflows/publish-invertebrata-privacy.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: invertebrata-privacy-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate static privacy page
        run: |
          set -euo pipefail
          test -s docs/privacy/index.html
          grep -q 'INVERTEBRATA' docs/privacy/index.html
          grep -q 'rameshgascngl@gmail.com' docs/privacy/index.html
          grep -q 'தனியுரிமைக் கொள்கை' docs/privacy/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
