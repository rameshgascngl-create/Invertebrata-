name: INVERTEBRATA Phase B2 Full Rerun Audit

on:
  push:
    branches:
      - audit/phase-b2-rerun-20260918
    paths:
      - .github/workflows/phase-b2-reconstruction-audit.yml
      - ci/phase_b2_action_audit.py

permissions:
  contents: read

jobs:
  phase-b2-full-rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Phase B2 precondition verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-b2/preflight"
          python ci/phase_b2_action_audit.py preflight \
            --repo "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/phase-b2/preflight"

      - name: Run A from fresh canonical ZIP
        shell: bash
        run: |
          set -euo pipefail
          python ci/phase_b2_action_audit.py run \
            --repo "$GITHUB_WORKSPACE" \
            --label A \
            --out "$RUNNER_TEMP/phase-b2/run-a"

      - name: Run B from independent fresh canonical ZIP
        shell: bash
        run: |
          set -euo pipefail
          python ci/phase_b2_action_audit.py run \
            --repo "$GITHUB_WORKSPACE" \
            --label B \
            --out "$RUNNER_TEMP/phase-b2/run-b"

      - name: Determinism and cross-run comparison
        shell: bash
        run: |
          set -euo pipefail
          python ci/phase_b2_action_audit.py compare \
            --a "$RUNNER_TEMP/phase-b2/run-a" \
            --b "$RUNNER_TEMP/phase-b2/run-b" \
            --out "$RUNNER_TEMP/phase-b2/comparison"

      - name: Collect Phase B2 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-b2/artifacts"
          if [ -d "$RUNNER_TEMP/phase-b2/preflight" ]; then cp -a "$RUNNER_TEMP/phase-b2/preflight/." "$RUNNER_TEMP/phase-b2/artifacts/"; fi
          if [ -d "$RUNNER_TEMP/phase-b2/run-a" ]; then find "$RUNNER_TEMP/phase-b2/run-a" -maxdepth 1 -type f -exec cp {} "$RUNNER_TEMP/phase-b2/artifacts/" \;; fi
          if [ -d "$RUNNER_TEMP/phase-b2/run-b" ]; then find "$RUNNER_TEMP/phase-b2/run-b" -maxdepth 1 -type f -exec cp {} "$RUNNER_TEMP/phase-b2/artifacts/" \;; fi
          if [ -d "$RUNNER_TEMP/phase-b2/comparison" ]; then cp -a "$RUNNER_TEMP/phase-b2/comparison/." "$RUNNER_TEMP/phase-b2/artifacts/"; fi
          {
            echo "AUDIT_BRANCH=${GITHUB_REF_NAME}"
            echo "AUDIT_COMMIT=${GITHUB_SHA}"
            echo "AUTHORITATIVE_BASELINE=e185e592ef5d02b6fd5d2ce65888591bea32ed27"
            echo "RELEASE_WORKFLOW_BLOB=$(git hash-object .github/workflows/invertebrata-v188-debug.yml)"
            echo "STEP4_BLOB=$(git hash-object ci/reconcile_v188_svg_batch2.py)"
            echo "STEP4_SHA256=$(sha256sum ci/reconcile_v188_svg_batch2.py | awk '{print $1}')"
            echo "GRADLE_INVOKED=NO"
            echo "APK_GENERATED=NO"
            echo "AAB_GENERATED=NO"
          } > "$RUNNER_TEMP/phase-b2/artifacts/AUDIT_HARNESS_INTEGRITY.txt"

      - name: Upload Phase B2 audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INVERTEBRATA-PHASE-B2-FULL-RERUN
          path: ${{ runner.temp }}/phase-b2/artifacts/
          if-no-files-found: error
          retention-days: 30
