name: INVERTEBRATA Phase B2 Step4 URL Diagnostic

on:
  push:
    branches:
      - audit/phase-b2-reconstruction-20260918
    paths:
      - .github/workflows/phase-b2-reconstruction-audit.yml
      - ci/phase_b2_action_audit.py

permissions:
  contents: read

jobs:
  phase-b2-step4-url-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify baseline and canonical ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-b2-url-diagnostic/preflight"
          python ci/phase_b2_action_audit.py preflight \
            --repo "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/phase-b2-url-diagnostic/preflight"

      - name: Reconstruct through Step 3 and enumerate HTTP(S) occurrences
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-b2-url-diagnostic/diagnostic"
          python ci/phase_b2_action_audit.py diagnose-step4-url \
            --repo "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/phase-b2-url-diagnostic/diagnostic"

      - name: Collect diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-b2-url-diagnostic/artifacts"
          if [ -d "$RUNNER_TEMP/phase-b2-url-diagnostic/preflight" ]; then
            cp -a "$RUNNER_TEMP/phase-b2-url-diagnostic/preflight/." "$RUNNER_TEMP/phase-b2-url-diagnostic/artifacts/"
          fi
          if [ -d "$RUNNER_TEMP/phase-b2-url-diagnostic/diagnostic" ]; then
            cp -a "$RUNNER_TEMP/phase-b2-url-diagnostic/diagnostic/." "$RUNNER_TEMP/phase-b2-url-diagnostic/artifacts/"
          fi
          {
            echo "AUDIT_BRANCH=${GITHUB_REF_NAME}"
            echo "AUDIT_COMMIT=${GITHUB_SHA}"
            echo "RELEASE_WORKFLOW_BLOB=$(git hash-object .github/workflows/invertebrata-v188-debug.yml)"
            echo "GRADLE_INVOKED=NO"
            echo "APK_GENERATED=NO"
          } > "$RUNNER_TEMP/phase-b2-url-diagnostic/artifacts/DIAGNOSTIC_HARNESS_INTEGRITY.txt"

      - name: Upload Step4 URL diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INVERTEBRATA-PHASE-B2-STEP4-URL-DIAGNOSTIC
          path: ${{ runner.temp }}/phase-b2-url-diagnostic/artifacts/
          if-no-files-found: error
          retention-days: 30
