name: Native R1.9 isolated Tamil200 physiology pause

on:
  push:
    branches:
      - native/r19-pause-tamil200-isolation-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tamil200-physiology:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile corrected instrumentation before emulator startup
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --stacktrace
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run ONLY failing physiology method in genuine Tamil 200 percent
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-native-r19-pause-isolation.sh
      - name: Always preserve Android XML, screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-r19-tamil200-isolated-pause-evidence
          path: qa-evidence/r19-pause-isolation/
          if-no-files-found: warn
