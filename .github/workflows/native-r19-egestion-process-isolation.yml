name: Native R1.9 isolated egestion midpoint process recovery

on:
  push:
    branches:
      - native/r19-egestion-hold-candidate-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api34-egestion-pid-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Precompile candidate Kotlin and Android tests
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --stacktrace
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test only actual cytoproct midpoint and PID kill/recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-native-r19-process-death.sh
      - name: Preserve exact-commit recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-r19-egestion-midpoint-pid-isolation-evidence
          path: qa-evidence/r19-process/
          if-no-files-found: warn
