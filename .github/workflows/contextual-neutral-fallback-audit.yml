name: INVERTEBRATA Semantic-Neutral Fallback Candidate

on:
  push:
    branches:
      - audit/contextual-neutral-fallback-20260919
    paths:
      - .github/workflows/contextual-neutral-fallback-audit.yml
      - ci/reconcile_v188.py
      - ci/v188_accepted_transform_manifest.json

permissions:
  contents: read

jobs:
  reconstruct-neutral-fallback-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record source state and verify scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/neutral-fallback"
          {
            echo "BRANCH=$GITHUB_REF_NAME"
            echo "HEAD=$(git rev-parse HEAD)"
            echo "STATUS_START"
            git status --short
            echo "STATUS_END"
            echo "DIFF_STAT_START"
            git diff --stat 8416ec813a7b8bb783896a4c4024ef22c1b401ad..HEAD
            echo "DIFF_STAT_END"
            echo "STEP2_BLOB=$(git hash-object ci/reconcile_v188.py)"
            echo "MANIFEST_BLOB=$(git hash-object ci/v188_accepted_transform_manifest.json)"
            echo "RELEASE_WORKFLOW_BLOB=$(git hash-object .github/workflows/invertebrata-v188-debug.yml)"
            sha256sum ci/reconcile_v188.py
          } | tee "$RUNNER_TEMP/neutral-fallback/SOURCE_STATE.txt"
          git diff 8416ec813a7b8bb783896a4c4024ef22c1b401ad..HEAD -- ci/reconcile_v188.py ci/v188_accepted_transform_manifest.json > "$RUNNER_TEMP/neutral-fallback/AUTHORIZED_DIFF.patch"
          test "$(git hash-object ci/reconcile_v188.py)" = "800967a036fd9ab078356c94e5063e93b7c6e508"
          test "$(git hash-object .github/workflows/invertebrata-v188-debug.yml)" = "8a5a851a17669fc5d7e26c076cce4b2fcd1e04df"

      - name: Verify 19-step audit manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          m=json.load(open('ci/v188_accepted_transform_manifest.json',encoding='utf-8'))
          assert len(m['steps'])==19
          assert [s['step'] for s in m['steps']]==list(range(1,20))
          s2=[s for s in m['steps'] if s['step']==2][0]
          assert s2['git_blob']=='800967a036fd9ab078356c94e5063e93b7c6e508'
          assert s2['governing_commit']=='a0d0e185b9b21d43214322f95ff6386f262688c0'
          assert sum(1 for s in m['steps'] if s['governing_commit'] in set(m.get('superseded_commits',[])))==0
          print('MANIFEST_19_OF_19=PASS')
          PY

      - name: Reconstruct candidate from canonical ZIP
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum INVERTEBRATA_v1.8.7_RECONCILED_ANDROID_SOURCE.zip | awk '{print $1}')" = "281e5f80a14f80df6ad87427a8e29859050f35430ec3158ad52b84ae607df1a3"
          python ci/reconstruct_v188_accepted_source.py reconstruct \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/neutral-fallback/work" \
            --output "$RUNNER_TEMP/neutral-fallback/AUTHORITATIVE_RECONSTRUCTED_SOURCE.html" \
            | tee "$RUNNER_TEMP/neutral-fallback/RECONSTRUCTION_LOG.txt"

      - name: Verify semantic-neutral source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'neutral-fallback/AUTHORITATIVE_RECONSTRUCTED_SOURCE.html'
          s=p.read_text(encoding='utf-8')
          required=[
            "function isDefaultVisibleNode(node)",
            "closest('details:not([open])')",
            ".filter(isDefaultVisibleNode)",
            "else if(isDefaultVisibleNode(visuals))",
            "var neutralAnchor=isDefaultVisibleNode(detail)?detail:pane;",
            "const generatedFigure=event.target.closest('.sys-fig');",
          ]
          for token in required: assert token in s, token
          assert "subs[Math.min(index" not in s
          print('NEUTRAL_FALLBACK_SOURCE_CONTRACT=PASS')
          print('RECONSTRUCTED_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print('RECONSTRUCTED_SIZE='+str(p.stat().st_size))
          PY

      - name: Upload candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INVERTEBRATA-CONTEXTUAL-NEUTRAL-FALLBACK-CANDIDATE
          path: ${{ runner.temp }}/neutral-fallback/
          if-no-files-found: error
          retention-days: 30
