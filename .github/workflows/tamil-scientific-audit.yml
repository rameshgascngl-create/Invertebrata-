name: Tamil scientific terminology audit
on:
  push:
    branches: ['codex/tamil-scientific-audit-20261103']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminology-and-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.6.0'}
      - name: Semantic regression scan
        run: |
          python3 -m unittest discover -s tools -p 'test_tamil_*.py' -v
      - name: Compile and run JVM contracts
        run: gradle -p native-app :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamil-scientific-audit-${{ github.sha }}
          path: native-app/app/build/test-results/testDebugUnitTest/
