name: INVERTEBRATA store packaging and privacy validation (QA, not publication)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/native-textbook-reader-qa
    paths:
      - 'native-app/app/src/main/**'
      - 'native-app/app/build.gradle.kts'
      - 'PRIVACY_POLICY.md'
      - 'release/**'
      - '.github/workflows/native-store-package-candidate.yml'
      - 'tools/export_store_icon.py'

permissions:
  contents: read

jobs:
  store-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile offline native release APK and AAB
        run: |
          set -euo pipefail
          gradle -p native-app :app:assembleRelease :app:bundleRelease :app:testDebugUnitTest --stacktrace
      - name: Export exact launcher icon for store listing
        run: |
          set -euo pipefail
          python3 -m pip install cairosvg
          python3 tools/export_store_icon.py
      - name: Inspect release package, offline policy, permissions and API level
        run: |
          set -euo pipefail
          mkdir -p release/store-artifacts/evidence
          APK="native-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          AAB="native-app/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)"
          "$BT/aapt" dump badging "$APK" > release/store-artifacts/evidence/badging.txt
          "$BT/aapt" dump permissions "$APK" > release/store-artifacts/evidence/permissions.txt
          grep -Fq "package: name='com.gasczoology.invertebratelab'" release/store-artifacts/evidence/badging.txt
          grep -Fq "targetSdkVersion:'36'" release/store-artifacts/evidence/badging.txt
          ! grep -Fq "application-debuggable" release/store-artifacts/evidence/badging.txt
          ! grep -Fq "android.permission.INTERNET" release/store-artifacts/evidence/permissions.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk=Path("native-app/app/build/outputs/apk/release/app-release-unsigned.apk")
          aab=Path("native-app/app/build/outputs/bundle/release/app-release.aab")
          for archive,prefix in ((apk,"assets/"),(aab,"base/assets/")):
              with zipfile.ZipFile(archive) as z:
                  files=set(z.namelist())
                  for lang in ("en","ta"):
                      name=prefix+"privacy_policy_"+lang+".txt"
                      assert name in files, f"Missing offline privacy policy: {name} in {archive}"
                      body=z.read(name).decode("utf-8")
                      assert "rameshgascngl@gmail.com" in body
                      assert "com.gasczoology.invertebratelab" in body
                  assert not any(x.startswith(prefix+"review_only/") for x in files), "Debug-only review assets in release"
          manifest=Path("native-app/app/src/main/AndroidManifest.xml").read_text()
          assert 'android:allowBackup="false"' in manifest
          assert "android.permission.INTERNET" not in manifest
          print("STORE_AUDIT package PASS; API36 PASS; Internet permission NONE; privacy EN+TA in APK and AAB PASS")
          PY
          cp "$APK" release/store-artifacts/INVERTEBRATA-1.9.0-RELEASE-UNSIGNED-NOT-FOR-SUBMISSION.apk
          cp "$AAB" release/store-artifacts/INVERTEBRATA-1.9.0-RELEASE-UNSIGNED-NOT-FOR-SUBMISSION.aab
          printf 'Audit-only: unsigned files cannot be submitted. Source commit: %s\n' "$GITHUB_SHA" > release/store-artifacts/evidence/README.txt
      - name: Sign APK and AAB only with the developer's existing release credentials
        id: sign
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -euo pipefail
          echo "signed=false" >> "$GITHUB_OUTPUT"
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "STORE_SIGNING=UNAVAILABLE: No existing complete release signing secret set."
            exit 0
          fi
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)"
          mkdir -p release/store-artifacts/signed
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/invertebrata-release.jks"
          chmod 600 "$RUNNER_TEMP/invertebrata-release.jks"
          trap 'rm -f "$RUNNER_TEMP/invertebrata-release.jks"' EXIT
          "$BT/zipalign" -f -p 4 release/store-artifacts/INVERTEBRATA-1.9.0-RELEASE-UNSIGNED-NOT-FOR-SUBMISSION.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/invertebrata-release.jks" --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
              --out release/store-artifacts/signed/INVERTEBRATA-1.9.0-RELEASE-SIGNED-REVIEW-ONLY.apk "$RUNNER_TEMP/aligned.apk"
          jarsigner -keystore "$RUNNER_TEMP/invertebrata-release.jks" -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" -sigalg SHA256withRSA -digestalg SHA-256 \
              -signedjar release/store-artifacts/signed/INVERTEBRATA-1.9.0-RELEASE-SIGNED-REVIEW-ONLY.aab \
              release/store-artifacts/INVERTEBRATA-1.9.0-RELEASE-UNSIGNED-NOT-FOR-SUBMISSION.aab "$KEY_ALIAS"
          "$BT/apksigner" verify --verbose --print-certs release/store-artifacts/signed/*.apk > release/store-artifacts/evidence/apk-signature.txt
          jarsigner -verify release/store-artifacts/signed/*.aab > release/store-artifacts/evidence/aab-signature.txt
          sha256sum release/store-artifacts/signed/* > release/store-artifacts/evidence/signed-sha256.txt
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "RELEASE_SIGNING=SUCCESS (still requires academic and physical-device approval)"
      - name: Upload store package audit and listing icon
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INVERTEBRATA-store-audit-and-icon-${{ github.sha }}
          path: |
            release/store-assets/INVERTEBRATA_icon_512.png
            release/store-artifacts/evidence/
            PRIVACY_POLICY.md
            release/INVERTEBRATA_STORE_SUBMISSION.md
          if-no-files-found: warn
          retention-days: 30
      - name: Upload unsigned APK and AAB for non-submission audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: INVERTEBRATA-UNSIGNED-NOT-FOR-STORE-${{ github.sha }}
          path: |
            release/store-artifacts/INVERTEBRATA-1.9.0-RELEASE-UNSIGNED-NOT-FOR-SUBMISSION.apk
            release/store-artifacts/INVERTEBRATA-1.9.0-RELEASE-UNSIGNED-NOT-FOR-SUBMISSION.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload signed store-candidate APK and AAB (conditional)
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: INVERTEBRATA-SIGNED-REVIEW-ONLY-${{ github.sha }}
          path: release/store-artifacts/signed/
          if-no-files-found: error
          retention-days: 30
