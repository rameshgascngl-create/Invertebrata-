name: Unit II scanned atlas candidate - native compile and real screenshots
'on':
  push:
    branches:
      - native/u2-scanned-plate-candidate-20261011
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-kotlin-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deterministic corrected WebP source masters
        run: |
          python3 -m venv /tmp/u2pillow
          /tmp/u2pillow/bin/pip install --disable-pip-version-check Pillow==11.3.0
          /tmp/u2pillow/bin/python ci/repair_unit2_plate_masters.py
          sha256sum native-app/app/src/main/assets/unit2/*.webp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Archive exact source WebP plates for scientific restoration
        uses: actions/upload-artifact@v4
        with:
          name: unit2-original-webp-masters
          path: native-app/app/src/main/assets/unit2/*.webp
          if-no-files-found: error
      - name: Source and JVM compile gate
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --stacktrace
      - name: Preserve corrected source master evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit2-restored-source-webp-candidate
          path: native-app/app/src/main/assets/unit2/*.webp
          if-no-files-found: error
      - name: Record explicit image-asset blocker
        run: |
          echo "SOURCE COMPILATION IS NOT ARTWORK, DEVICE, OR ACADEMIC ACCEPTANCE"
          for f in sycon_plate.webp obelia_colony.webp obelia_lifecycle.webp; do
            p="native-app/app/src/main/assets/unit2/$f"
            if [ -s "$p" ]; then
              echo "ASSET PRESENT (still scientifically unverified): $f"
            else
              echo "::warning::ASSET PENDING: $p"
            fi
          done
          echo "Human anatomy, Tamil review, hotspots and device QA remain PENDING."

  native-unit-two-android:
    needs: compile-kotlin-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deterministic corrected WebP source masters
        run: |
          python3 -m venv /tmp/u2pillow
          /tmp/u2pillow/bin/pip install --disable-pip-version-check Pillow==11.3.0
          /tmp/u2pillow/bin/python ci/repair_unit2_plate_masters.py
          sha256sum native-app/app/src/main/assets/unit2/*.webp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate Sycon and Obelia navigation on Android API34 at genuine Tamil200 scale
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-unit2-screenshot-audit.sh
      - name: Preserve Android XML and screenshot test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit2-image-candidate-api34-evidence
          path: qa-evidence/unit2-screenshots/
          if-no-files-found: error

      - name: Promote native image masters only after Android acceptance
        if: success() && github.ref_name == 'native/u2-scanned-plate-candidate-20261011'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-app/app/src/main/assets/unit2/sycon_plate.webp native-app/app/src/main/assets/unit2/obelia_colony.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(Unit II): replace underlying Sycon and Obelia masters after screenshot QA"
            git push origin "HEAD:refs/heads/native/u2-scanned-plate-candidate-20261011"
          else
            echo "Already source-integrated: no binary changes."
          fi
