name: Unit II scanned atlas candidate - compile only
'on':
  push:
    branches:
      - native/u2-scanned-plate-candidate-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-kotlin-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Source and JVM compile gate
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --stacktrace
      - name: Record explicit image-asset blocker
        run: |
          echo "SOURCE COMPILATION IS NOT ARTWORK, DEVICE, OR ACADEMIC ACCEPTANCE"
          for f in sycon_plate.webp obelia_colony.webp obelia_lifecycle.webp; do
            p="native-app/app/src/main/assets/unit2/$f"
            if [ -s "$p" ]; then
              echo "ASSET PRESENT (still scientifically unverified): $f"
            else
              echo "::warning::ASSET PENDING: $p"
            fi
          done
          echo "Human anatomy, Tamil review, hotspots and device QA remain PENDING."
