name: Image-only practical plate acceptance — Units I–V
'on':
  push:
    branches:
      - native/u49-image-only-pencil-policy-20261017
      - native/u50-unit2-static-image-only-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Check native Kotlin and instrumentation sources still compile
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --stacktrace
  static-pencil-image-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enforce image-only anatomy in all five native units
        run: python3 qa/validate_image_only_artwork.py
      - name: Preserve honest image-only acceptance inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-only-artwork-policy-evidence
          path: qa-evidence/image-only/audit.json
          if-no-files-found: error
