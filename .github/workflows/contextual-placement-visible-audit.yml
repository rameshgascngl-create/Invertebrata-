name: INVERTEBRATA Contextual Placement Visibility Candidate

on:
  push:
    branches:
      - audit/contextual-placement-visible-20260919
    paths:
      - .github/workflows/contextual-placement-visible-audit.yml
      - ci/reconcile_v188.py
      - ci/v188_accepted_transform_manifest.json

permissions:
  contents: read

jobs:
  reconstruct-visibility-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/reconcile_v188.py)" = "82f4c52ea123f7b9b21466011ee3640db7d442d0"
          test "$(git hash-object .github/workflows/invertebrata-v188-debug.yml)" = "8a5a851a17669fc5d7e26c076cce4b2fcd1e04df"
          python - <<'PY'
          import json
          m=json.load(open('ci/v188_accepted_transform_manifest.json',encoding='utf-8'))
          assert len(m['steps'])==19
          assert [s['step'] for s in m['steps']]==list(range(1,20))
          s2=[s for s in m['steps'] if s['step']==2][0]
          assert s2['git_blob']=='82f4c52ea123f7b9b21466011ee3640db7d442d0'
          assert sum(1 for s in m['steps'] if s['governing_commit'] in set(m.get('superseded_commits',[])))==0
          PY

      - name: Reconstruct candidate from canonical ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/visibility-candidate"
          python ci/reconstruct_v188_accepted_source.py reconstruct \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/visibility-candidate/work" \
            --output "$RUNNER_TEMP/visibility-candidate/AUTHORITATIVE_RECONSTRUCTED_SOURCE.html" \
            | tee "$RUNNER_TEMP/visibility-candidate/RECONSTRUCTION_LOG.txt"

      - name: Verify visibility filter source fragments
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'visibility-candidate/AUTHORITATIVE_RECONSTRUCTED_SOURCE.html'
          s=p.read_text(encoding='utf-8')
          assert "function isDefaultVisibleSubsection(sec)" in s
          assert "closest('details:not([open])')" in s
          assert ".filter(isDefaultVisibleSubsection)" in s
          assert "const generatedFigure=event.target.closest('.sys-fig');" in s
          assert "var anchor=sections[Math.min(index,Math.max(0,sections.length-1))]" in s
          print('VISIBILITY_FILTER_SOURCE=PASS')
          print('RECONSTRUCTED_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print('RECONSTRUCTED_SIZE='+str(p.stat().st_size))
          PY

      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INVERTEBRATA-CONTEXTUAL-PLACEMENT-VISIBILITY-CANDIDATE
          path: ${{ runner.temp }}/visibility-candidate/
          if-no-files-found: error
          retention-days: 30
