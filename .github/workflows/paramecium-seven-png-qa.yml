name: Paramecium seven PNG Android QA
on:
  push:
    branches: [Unit-I]
    paths:
      - 'native-app/app/src/main/assets/unit1/paramecium_*.png'
      - 'native-app/app/src/main/assets/type_studies/paramecium/*.png'
      - '.github/workflows/paramecium-seven-png-qa.yml'
      - '.github/scripts/run-u58-paramecium-context-png.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asset-and-android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Validate seven PNG assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          root=Path('native-app/app/src/main/assets')
          paths=[
            'unit1/paramecium_external.png',
            'unit1/paramecium_internal.png',
            'unit1/paramecium_oral.png',
            'unit1/paramecium_vacuole.png',
            'type_studies/paramecium/external-cilia.png',
            'type_studies/paramecium/oral-apparatus.png',
            'type_studies/paramecium/contractile-vacuoles.png',
          ]
          for path in paths:
            b=(root/path).read_bytes()
            assert b[:8]==bytes.fromhex('89504e470d0a1a0a'),path
            width,height=struct.unpack('>II',b[16:24])
            assert width>=100 and height>=100,(path,width,height)
            print(path,width,height,len(b))
          print('All seven PNGs structurally valid; anatomical and Tamil review still required')
          PY
      - name: Compile app and Android instrumentation tests
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --stacktrace
      - name: Assemble QA APK
        run: gradle -p native-app :app:assembleDebug --stacktrace
      - name: Upload unapproved APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: paramecium-seven-png-unapproved-qa-apk
          path: native-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-screenshot-evidence:
    needs: asset-and-android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture English and Tamil 100 and 200 percent Paramecium screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-u58-paramecium-context-png.sh
      - name: Upload screenshot XML and log evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paramecium-seven-png-android-screenshots-and-xml
          path: qa-evidence/u58-reader/
          if-no-files-found: warn
