name: Native foundation check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/native-textbook-reader-qa
  push:
    branches:
      - native/v193-compose-migration-20261008
      - native/r15-feeding-textbook-20261010
      - claude/audit-l10n
      - claude/fix-home-label-tests
      - claude/unit1-plates-and-parasite-slots
      - feat/native-textbook-reader-qa
      - audit/undergraduate-coverage-register-20261114

jobs:
  compile-native-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile Kotlin and run JVM unit tests
        run: gradle -p native-app :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace
      - name: Compile Android instrumentation tests and assemble debug APK
        run: gradle -p native-app :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace
      - name: Validate five-unit bilingual A5 question-answer integrity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('native-app/app/src/main/assets/a5')
          total = 0
          for unit in range(1, 6):
              data = json.loads((root / f'U{unit}_A5_VALIDATED.json').read_text(encoding='utf-8'))
              for chapter_id, chapter in data.items():
                  total += 1
                  assert chapter['id'] == chapter_id, f'{chapter_id}: mismatched ID'
                  for lang in ('en', 'ta'):
                      questions = chapter[f'q5_{lang}']
                      answers = chapter[f'a5_{lang}']
                      assert len(questions) == len(answers), f'{chapter_id}: {lang} count mismatch'
                      assert all(isinstance(a, list) and len(a) == 5 and all(isinstance(p, str) and p.strip() for p in a) for a in answers), f'{chapter_id}: {lang} invalid five-point answer'
              print(f'Unit {unit}: {len(data)} chapters validated')
          assert total == 43, f'Expected 43 chapters, got {total}'
          PY
      - name: Prohibit legacy runtime in native module
        run: |
          if grep -RniE 'WebView|android\.webkit|<script|javascript:' native-app/app/src/main; then
            echo 'Legacy browser runtime detected in native module' >&2
            exit 1
          fi
          if grep -Rni '<uses-permission[^>]*INTERNET' native-app/app/src/main/AndroidManifest.xml; then
            echo 'Unexpected INTERNET permission' >&2
            exit 1
          fi
      - name: Upload debug QA APK for verification (not store release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: invertebrata-native-debug-qa-${{ github.sha }}
          path: native-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
