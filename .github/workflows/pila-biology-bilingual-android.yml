name: Pila scientific textbook bilingual Android acceptance
on:
  push:
    branches: ['feat/plate-pipeline']
    paths:
      - 'native-app/**'
      - '.github/scripts/run-pila-biology-qa.sh'
      - '.github/workflows/pila-biology-bilingual-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pila-biology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Validate source and test runner
        run: bash -n .github/scripts/run-pila-biology-qa.sh
      - name: Compile app and instrumented tests, run JVM tests
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pila-science-jvm-test-results
          path: native-app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  emulator-100-200:
    needs: build-and-jvm
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Inspect actual Pila lesson on offline Android at both font scales
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-pila-biology-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pila-science-api34-en-ta-100-200-screenshots
          path: qa-evidence/pila-biology/
          if-no-files-found: warn
