name: INVERTEBRATA v1.9.0 permanent-key signing (review only)
on:
  workflow_dispatch:
  push:
    branches:
      - feat/native-textbook-reader-qa
    paths:
      - .github/workflows/native-v190-secure-signing.yml
permissions:
  contents: read

jobs:
  permanent-key-signed-review:
    if: github.ref == 'refs/heads/feat/native-textbook-reader-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
      - name: Check production signing credentials
        shell: bash
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          EXPECTED_CERT_SHA256: ${{ secrets.INVERTEBRATA_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KS_B64 KS_PASS KEY_ALIAS KEY_PASS EXPECTED_CERT_SHA256; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Missing repository secret: $name (see release/V190_SIGNING_SETUP.md)"
              exit 2
            fi
          done
          echo "PERMANENT_SIGNING_SECRETS_PRESENT=PASS"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply the same lossless illustration optimisation as the 75 MB QA APK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install pillow
          python3 tools/optimise_plates.py --out build/optimised-assets
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          assets=Path("native-app/app/src/main/assets")
          optimised=Path("build/optimised-assets")
          rows=json.loads((optimised/"optimisation-manifest.json").read_text())["files"]
          replaced=0
          for row in rows:
              if row["kept_original"]:
                  continue
              src=assets/row["source"]
              dst=assets/row["output"]
              assert not row["source"].startswith(("unit1/","nereis/","review_only/")), row["source"]
              if src.suffix.lower() != ".webp":
                  src.unlink()
              shutil.copyfile(optimised/row["output"],dst)
              replaced+=1
          print(f"LOSSLESS_RELEASE_ILLUSTRATION_OPTIMISATION={replaced} replacements")
          PY
      - name: Build unsigned release APK and AAB and run JVM tests
        shell: bash
        run: |
          set -euo pipefail
          gradle -p native-app :app:assembleRelease :app:bundleRelease :app:testDebugUnitTest --stacktrace
      - name: Sign with the existing permanent certificate and verify
        shell: bash
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          EXPECTED_CERT_SHA256: ${{ secrets.INVERTEBRATA_RELEASE_CERT_SHA256 }}
        run: bash .github/scripts/sign-native-v190-review.sh
      - name: Upload permanent-key-signed REVIEW-ONLY APK AAB and evidence
        uses: actions/upload-artifact@v4
        with:
          name: INVERTEBRATA-v190-PERMANENT-KEY-SIGNED-REVIEW-ONLY-${{ github.sha }}
          path: |
            release/signed-review/*.apk
            release/signed-review/*.aab
            release/signed-review/evidence/
          if-no-files-found: error
          retention-days: 30
