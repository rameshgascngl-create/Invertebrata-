name: Native simulator and paged-reader repairs
on:
  push:
    branches: ['codex/fix-simulators-reading-20261102', 'claude/fix-ciliary-release-viewport-20261102']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: functional-repairs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile-and-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.6.0'}
      - name: Validate evidence classification
        run: python3 -m unittest discover -s tools -p test_summarise_android_test_evidence.py
      - name: Compile application and all instrumentation; run JVM contracts
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Record exact APK identities
        if: success()
        run: |
          mkdir -p qa-evidence/functional-apk
          cp native-app/app/build/outputs/apk/debug/*.apk qa-evidence/functional-apk/
          cp native-app/app/build/outputs/apk/androidTest/debug/*.apk qa-evidence/functional-apk/
          printf '%s\n' "$GITHUB_SHA" > qa-evidence/functional-apk/commit.txt
          (cd qa-evidence/functional-apk && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-functional-debug-${{ github.sha }}
          path: |
            qa-evidence/functional-apk/
            native-app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  android-functional:
    needs: compile-and-jvm
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
        configuration: [english100, tamil100, tamil200, tamil200landscape]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.6.0'}
      - name: Apply the release candidate's lossless WebP overlay
        if: matrix.variant == 'release'
        run: |
          python -m pip install pillow
          python tools/optimise_plates.py --out build/optimised-assets
          python - <<'PY'
          import json,pathlib,shutil
          assets=pathlib.Path('native-app/app/src/main/assets')
          output=pathlib.Path('build/optimised-assets')
          manifest=json.loads((output/'optimisation-manifest.json').read_text())
          for row in manifest['files']:
              if row['kept_original']: continue
              assert not row['source'].startswith(('unit1/','nereis/','review_only/'))
              source=assets/row['source']; target=assets/row['output']
              if source.suffix.lower() != '.webp': source.unlink()
              shutil.copyfile(output/row['output'],target)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the actual installed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-native-functional-repairs.sh '${{ matrix.variant }}' '${{ matrix.configuration }}'
      - name: Produce canonical test evidence
        if: always()
        run: python3 tools/summarise_android_test_evidence.py qa-evidence/functional
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-functional-${{ matrix.variant }}-${{ matrix.configuration }}-${{ github.sha }}
          path: qa-evidence/functional/
          if-no-files-found: error

  established-regressions:
    needs: compile-and-jvm
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [established, unit23, ciliary, quality, water, nuclear, nutrition, process-death]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.6.0'}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-native-functional-regressions.sh '${{ matrix.suite }}'
      - name: Produce canonical test evidence
        if: always()
        run: python3 tools/summarise_android_test_evidence.py qa-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-functional-regression-${{ matrix.suite }}-${{ github.sha }}
          path: qa-evidence/
          if-no-files-found: warn
