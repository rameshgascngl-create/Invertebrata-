name: NOAA coral plate bilingual Android acceptance
on:
  push:
    branches: ['feat/plate-pipeline']
    paths:
      - 'native-app/**'
      - '.github/workflows/noaa-coral-android-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coral-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Verify asset SHA, bilingual text and compile instrumentation
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noaa-coral-jvm-evidence
          path: native-app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  coral-emulator:
    needs: coral-jvm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android API 34 tests at both system font scales
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            mkdir -p qa-evidence/noaa-coral
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            for scale in 1.0 2.0; do
              adb shell settings put system font_scale "$scale"
              adb shell settings get system font_scale | tr -d '\r' | grep -Fx "$scale"
              gradle -p native-app :app:connectedDebugAndroidTest --stacktrace \
                -Pandroid.testInstrumentationRunnerArguments.class=com.gasczoology.invertebratelab.NativeNoaaCoralBookTest \
                -Pandroid.testInstrumentationRunnerArguments.expectedScale="$scale"
              mkdir -p "qa-evidence/noaa-coral/xml-$scale"
              cp -a native-app/app/build/outputs/androidTest-results/connected/. "qa-evidence/noaa-coral/xml-$scale/"
            done
            adb pull /sdcard/Download/noaa-coral-qa qa-evidence/noaa-coral/captured
            python3 - <<'PY'
            from pathlib import Path
            from xml.etree import ElementTree as ET
            root=Path('qa-evidence/noaa-coral')
            cases=[c for p in root.rglob('TEST-*.xml') for c in ET.parse(p).getroot().iter('testcase')
                   if c.get('classname')=='com.gasczoology.invertebratelab.NativeNoaaCoralBookTest']
            assert len(cases)==4,('EXPECTED_4_SCENARIOS',len(cases))
            assert all(c.find(k) is None for c in cases for k in ['failure','error','skipped'])
            pictures=list((root/'captured').rglob('coral-*.png'))
            assert len(pictures)==8,('EXPECTED_8_REAL_DISPLAY_SHOTS',len(pictures))
            assert all(p.stat().st_size>10000 for p in pictures)
            print('NOAA_CORAL_API34_EN_TA_100_200_AND_ZOOM_PASS')
            PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noaa-coral-api34-100-200-evidence
          path: qa-evidence/noaa-coral/
          if-no-files-found: warn
