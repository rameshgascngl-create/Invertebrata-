name: Unit IV native Earthworm academic foundation - exact-commit engineering validation
'on':
  push:
    branches:
      - native/u4-earthworm-academic-foundation-20261014
      - native/u4-penaeus-substantive-textbook-20261016
      - native/u42-penaeus-external-anatomy-schematic-20261016
      - native/u43-earthworm-functional-external-atlas-20261017
      - native/u44-nereis-static-bilingual-atlas-20261017
      - native/u45-nereis-numbered-leader-qa-20261017
      - native/u46-nereis-legend-evidence-remediation-20261017
      - native/u47-nereis-legend-scroll-evidence-20261017
      - native/u48-nereis-external-pencil-image-candidate-20261017
      - native/u53-nereis-eight-static-png-masters-20261017
      - native/u54-nereis-real-png-pixel-qa-20261017
      - native/u55-nereis-image-viewer-20261017
      - native/u56-unit4-complete-biology-lessons-20261017
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-unit4-earthworm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  academic-and-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify independent Unit IV lesson and protected A5 original
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("native-app/app/src/main/java/com/gasczoology/invertebratelab")
          lessons=(root/"data/UnitIVEarthwormLessons.kt").read_text(encoding="utf-8")
          manifest=(root/"data/NativeCurriculumManifest.kt").read_text(encoding="utf-8")
          ui=(root/"ui/UnitIVEarthwormReader.kt").read_text(encoding="utf-8")
          nav=(root/"ui/InvertebrataApp.kt").read_text(encoding="utf-8")
          for text in ["Metaphire posthuma","Pheretima posthuma","XIV–XVI","perichaetine",
                       "pharyngeal","septal","integumentary","typhlosole"]:
              assert text.lower() in lessons.lower(),text
          for plate in ["external-setae","digestive","circulatory","nervous","excretory","reproductive"]:
              assert plate in lessons
              assert not any((Path("native-app/app/src/main/assets/type_studies/earthworm")/(plate+"."+ext)).exists() for ext in ["png","webp"]), plate
          assert 'EARTHWORM_TEXTBOOK' in nav and 'u4-open-earthworm-textbook' in nav
          penaeus=(root/"data/UnitIVPenaeusTeaching.kt").read_text(encoding="utf-8")
          prawnui=(root/"ui/UnitIVPenaeusTextbook.kt").read_text(encoding="utf-8")
          for term in ["Penaeus indicus","Fenneropenaeus indicus",
                       "19 PAIRS", "nauplius","protozoea","mysis","postlarva",
                       "petasma","thelycum","5 + 8 + 6 = 19"]:
              assert term.lower() in (penaeus+prawnui).lower(),term
          assert 'PenaeusAppendageGroup(' in penaeus
          assert 'UnitIVPenaeusTeaching.sections' in nav
          assert 'UnitIVPenaeusAppendageExplorer' in nav
          assert 'UnitIVPenaeusLifeCycleExplorer' in nav
          atlas=(root/"ui/UnitIVPenaeusVectorAtlas.kt").read_text(encoding="utf-8")
          for term in ["Canvas(", "detectTapGestures", "u42-penaeus-vector-canvas",
                       "PenaeusExternalAtlas.hit", "OfflineNarrator", "u42-penaeus-schematic-disclosure",
                       "rostrum", "pereiopods", "pleopods", "uropods", "telson"]:
              assert term in atlas,term
          assert 'UnitIVPenaeusVectorAtlas(language, penaeusExternalPart)' in nav
          assert 'rememberSaveable(chapter.id)' in nav
          assert 'tamilNativeDiagramSelectsActualNamedVectorStructureAndRetainsSelection' in Path(
              "native-app/app/src/androidTest/java/com/gasczoology/invertebratelab/NativeUnitIVPenaeusTest.kt").read_text()

          assert 'u4-penaeus-a5-original-heading' in nav
          assert 'rememberSaveable(chapter.id)' in nav
          assert 'u4-penaeus-academic-hold' in prawnui
          assert 'OfflineNarrator(' in prawnui
          assert 'u4-penaeus-atlas-pending' in prawnui
          assert 'AcademicWorkStatus.DRAFT_UNVERIFIED' in manifest
          assert 'native/u4-penaeus-substantive-textbook-20261016' in Path('.github/workflows/native-unit4-earthworm-foundation.yml').read_text()
          assert 'assertEquals' in Path('native-app/app/src/androidTest/java/com/gasczoology/invertebratelab/NativeUnitIVPenaeusTest.kt').read_text() or 'assertTextContains' in Path('native-app/app/src/androidTest/java/com/gasczoology/invertebratelab/NativeUnitIVPenaeusTest.kt').read_text()

          assert 'u4-earthworm-plate-pending-' in ui

          nereis=(root/"data/UnitIVNereisLessons.kt").read_text(encoding="utf-8")
          nereis_ui=(root/"ui/UnitIVNereisStaticPlates.kt").read_text(encoding="utf-8")
          image_ui=(root/"ui/UnitIVNereisRasterPlates.kt").read_text(encoding="utf-8")
          for term in ['"identity"','"habitat"','"external"','"head"','"parapodia"',
                       '"digestion"','"circulation"','"nervous"','"excretion"',
                       '"reproduction"','"larvae"','"ecology"']:
              assert term in nereis,term
          assert "UnitIVNereisStaticPlate(plateIndex,language)" in nav
          assert 'NereisTextbookSection' in nereis
          assert 'UnitIVNereisRasterPlate(index,language)' in nereis_ui
          assert 'Canvas(' not in nereis_ui
          assert 'pointerInput' not in nereis_ui + image_ui
          assert 'detectTapGestures' not in nereis_ui + image_ui
          assert 'Image(' in image_ui
          assert 'ctx.assets.open(source)' in image_ui
          assert 'contentScale = ContentScale.Fit' in image_ui
          assert 'NereisRasterManifest.filenames[index]' in image_ui
          for invariant in ['rememberTransformableState', 'DialogProperties(usePlatformDefaultWidth = false)',
                            'u55-nereis-fullscreen-dialog-', 'u55-nereis-zoom-reset',
                            'u55-nereis-fullscreen-image-', 'u55-nereis-open-full-image-']:
              assert invariant in image_ui, ("Missing zoom-image viewer", invariant)
          assert 'fullscreenStaticPencilPlateZoomControlsWorkInTamilAndReturnToReader' in Path(
              'native-app/app/src/androidTest/java/com/gasczoology/invertebratelab/NativeUnitIVNereisTest.kt').read_text()
          assert 'Canvas(' not in image_ui

          assert 'u53-nereis-raster-missing-' in image_ui
          assert 'nereisPlateTerms(index)' in image_ui
          assert 'R.drawable.nereis_external_graphite_candidate' not in nereis_ui + image_ui
          assert '.png' in image_ui
          assert 'UnitIVNereisLessons.plateTopics[index]' in image_ui
          nereis_test = Path('native-app/app/src/androidTest/java/com/gasczoology/invertebratelab/NativeUnitIVNereisTest.kt').read_text()
          assert 'Nereis drawing raster missing' in nereis_test
          assert 'rasterInkAgreement' in nereis_test
          assert 'sourceInk>=60 && matchedInk*100>=sourceInk*55' in nereis_test
          assert 'plateIndex=index,plateBounds=box' in nereis_test
          assert 'graphitePaperSamples' not in nereis_test
          assert 'u44-nereis-sources' in nav
          print("NEREIS_EIGHT_PNG_IMAGE_ONLY_READER_SOURCE=PASS; ACTUAL_ASSETS_SEPARATELY_REQUIRED")
          earthworm_atlas=(root/"ui/UnitIVEarthwormExternalAtlas.kt").read_text(encoding="utf-8")
          for required in ["Canvas(", "detectTapGestures", "u43-earthworm-canvas",
                           "EarthwormExternalTeaching.hit", "OfflineNarrator",
                           "prostomium", "peristomium", "spermathecal", "clitellum",
                           "female-pore", "male-pores", "setae", "annuli", "anus"]:
              assert required in earthworm_atlas,required
          assert "UnitIVEarthwormExternalAtlas(language, externalOrgan)" in ui
          assert "rememberSaveable" in ui
          assert "tamilExternalAtlasTapAndLazyScrollPreserveNamedGenitalPores" in Path(
              "native-app/app/src/androidTest/java/com/gasczoology/invertebratelab/NativeUnitIVEarthwormTest.kt").read_text()

          # Six previously assessment-only Unit IV chapter headings now carry
          # self-contained bilingual biology before UNCHANGED original A5.
          supplementary=(root/"data/UnitIVSupplementaryLessons.kt").read_text(encoding="utf-8")
          for chapter_id in ["u4-annelida","u4-metamerism","u4-modes-life",
                             "u4-arthropoda","u4-peripatus","u4-crustacean-larvae"]:
              assert '"'+chapter_id+'"' in supplementary,chapter_id
          assert 'check(chapters.size==6)' in supplementary
          for topic in ["nauplius","protozoea","mysis","megalopa","Onychophora",
                        "Panarthropoda","metamerism","ectodysis"]:
              if topic=="ectodysis":continue
              assert topic.lower() in supplementary.lower(),topic
          assert 'UnitIVSupplementaryLessons.byId.getValue(chapter.id)' in nav
          assert 'u56-original-a5-heading' in nav
          assert 'u56-section-' in nav
          assert 'items(chapter.a5Questions, key = { it.id })' in nav
          suite=Path('native-app/app/src/androidTest/java/com/gasczoology/invertebratelab/NativeUnitIVSupplementaryTest.kt')
          t=suite.read_text(encoding='utf-8')
          assert 'englishPeripatusRealBiologyAndOriginalFiveMarkQuestions' in t
          assert 'tamilCrustaceanDevelopmentAvoidsFalseUniversalLarvalSequence' in t
          print("U56_SIX_NEW_BILINGUAL_UNIT_IV_CHAPTERS=PASS ORIGINAL_A5=UNALTERED")
          assert 'EXISTING_A5_CHAPTER_COUNT = 43' in manifest
          assert 'REQUIRED_LESSON_SLOTS = 44' in manifest
          import json
          records=[]
          for n in range(1,6):
              p=Path("native-app/app/src/main/assets/a5/U"+str(n)+"_A5_VALIDATED.json")
              assert p.is_file(),p
              records.append((str(p),len(p.read_bytes())))
          print("UNIT4_NATIVE_FOUNDATION_PRESENT=PASS A5_FILES="+repr(records))
          print("SIX_REQUIRED_EARTHWORM_RASTERS=PENDING; ACADEMIC_APPROVAL=HOLD")
          PY
      - name: Compile Kotlin, instrumentation sources and run all JVM tests
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --stacktrace
      - name: Require genuine eight Nereis PNG assets in this exact commit
        run: python3 .github/scripts/verify-nereis-png-masters.py

  android-ui:
    needs: academic-and-compile
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native API34 Earthworm at 100% and 200% font scale, offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-unit4-earthworm-audit.sh
      - name: Preserve exact-commit XML, raster screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit4-earthworm-academic-foundation-api34-evidence
          path: qa-evidence/unit4/
          if-no-files-found: warn
      - name: Assemble native engineering debug APK
        if: success()
        run: gradle -p native-app :app:assembleDebug --stacktrace
      - name: Preserve exact-commit engineering QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unit4-earthworm-native-debug-qa-apk
          path: native-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Academic artwork and physical-device release gate
        if: always()
        run: |
          echo "U4.0 BILINGUAL TEXTBOOK = editorial draft."
          echo "Six Earthworm pencil anatomical masters, coordinates, screenshots and audible Tamil device QA = OPEN."
          echo "Do NOT release or merge into Play/Indus as academically accepted."
