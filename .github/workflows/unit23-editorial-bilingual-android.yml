          assert 'கசையிழைக் கொத்துடைய வெற்று கழிவு நீக்க செல்' not in platy
          assert 'குறுஇழைக் கற்றையைக் கொண்ட கழிவுநீக்கச் செல்' in platy
          assert 'கசையிழை எப்பிடெர்மிஸ்' not in platy
