name: Unit II-III textbook bilingual Android acceptance
on:
  push:
    branches: ['feat/plate-pipeline', 'claude/audit-l10n', 'claude/fix-home-label-tests', 'fix/tamil-porifera-reader-bilingual-20261118']
    paths:
      - 'native-app/**'
      - '.github/scripts/run-unit23-editorial-qa.sh'
      - '.github/workflows/unit23-editorial-bilingual-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit23-textbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-and-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Check Bash syntax
        run: bash -n .github/scripts/run-unit23-editorial-qa.sh
      - name: Guard corrected scientific Tamil and amphiblastula stage sequence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('native-app/app/src/main/java/com/gasczoology/invertebratelab/data')
          reproduction = (root / 'PoriferaReproductionBookChapter.kt').read_text(encoding='utf-8')
          cnidaria = (root / 'CnidariaBookChapter.kt').read_text(encoding='utf-8')
          obelia = (root / 'ObeliaBookChapter.kt').read_text(encoding='utf-8')
          corals = (root / 'CoralsBookChapter.kt').read_text(encoding='utf-8')
          economics = (root / 'CoralEconomicsBookChapter.kt').read_text(encoding='utf-8')
          polymorphism = (root / 'PolymorphismBookChapter.kt').read_text(encoding='utf-8')
          platy = (root / 'PlatyhelminthesBookChapter.kt').read_text(encoding='utf-8')
          fasciola = (root / 'FasciolaBookChapter.kt').read_text(encoding='utf-8')
          adaptations = (root / 'PlatyAdaptationsBookChapter.kt').read_text(encoding='utf-8')
          nematoda = (root / 'AschelminthesBookChapter.kt').read_text(encoding='utf-8')
          ascaris = (root / 'AscarisBookChapter.kt').read_text(encoding='utf-8')
          nematode_parasites = (root / 'NematodeParasitesBookChapter.kt').read_text(encoding='utf-8')
          assert 'Embryonic inversion exposes the cilia before the amphiblastula is released' in reproduction
          assert 'கருவளர்ச்சிக் காலப் புரட்டலால் ஆம்ஃபிபிளாஸ்டுலா' in reproduction
          assert 'inversion brings the flagellated cells to the inside' not in reproduction.lower()
          assert 'புரட்டல் கசையிழை செல்களை உள்ளே கொண்டு வருகிறது' not in reproduction
          assert 'போர்த்துக்கீசிய போர்க்கப்பல் மீனும்' not in cnidaria
          assert 'பைசாலியா (Physalia) காலனி நிடேரிய உயிரி' in cnidaria
          assert 'எப்பிதீலியோதசை' not in cnidaria
          assert 'கூட்டுயிரி' not in obelia
          assert 'கசைகள் உள்ளடக்கத்தைக் கலக்குதல்' not in obelia
          assert 'காலனி' in obelia and 'பாலியல் இனப்பெருக்கம்' in obelia
          assert 'காலனிகளாக வாழ்கின்றன' in corals
          assert 'கால்சிப்ளாஸ்டிக்' not in corals
          assert 'காலிகோபிளாஸ்டிக் எப்பிடெர்மிஸ்' in corals
          assert 'Only the stony corals with zooxanthellae make the reef framework.' not in corals
          assert 'Zooxanthellate stony corals are the main builders' in corals
          assert 'பவளப்பாறை என்பது ஒற்றை உயிரி அல்ல' in corals
          assert 'முகடு கால்சியம் கார்பனேட்டின் தொழிற்சாலை' not in economics
          assert 'பவளக் காலனிகள் உயிர்வாழ வேண்டும்' in economics
          assert 'Schedule I of the Wild Life (Protection) Act' in economics
          assert 'அட்டவணை I-இல்' in economics
          assert 'சமூகப் பூச்சிகளின் சாதிகளில்' not in polymorphism
          assert 'சமூகப் பூச்சிகளின் பணிவகுப்புகளில்' in polymorphism
          assert 'நீண்ட மீன்பிடி உணர்கொம்புகள்' not in polymorphism
          assert 'Hydrozoans show this division of labour despite lacking a centralised brain' in polymorphism
          assert 'வாயு மிதவையால் கடல்மேற்பரப்பில் தாங்கப்படுவது' in polymorphism
          assert 'கசையிழைக் கொத்துடைய வெற்று கழிவு நீக்க செல்' not in platy
          assert 'குறுஇழைக் கற்றையைக் கொண்ட கழிவுநீக்கச் செல்' in platy
          assert 'கசையிழை எப்பிடெர்மிஸ்' not in platy
          assert 'குறுஇழைகள் கொண்ட புறத்தோல்' in platy
          assert 'உறிஞ்சிப் புழுக்கள் (ஃப்ளூக்குகள்)' in platy
          assert 'not direct representatives of the ancestors of other bilaterians' in platy
          assert 'நேரடி மூதாதையர்களாகக் கருதக் கூடாது' in platy
          assert 'ஊடைப்பு' not in fasciola
          assert 'முட்டை உருவாக்க அறை (Ootype)' in fasciola
          assert 'முதன்மை விருந்தோம்பி' not in fasciola
          assert 'இறுதி விருந்தோம்பி' in fasciola
          assert 'குடல் குருட்டுக் கிளைகள் (சீக்கா)' in fasciola
          assert 'stage infective to the mammalian definitive host' in fasciola
          assert 'பாலூட்டியைத் தொற்றும் மெட்டாசெர்க்கேரியா' in fasciola
          assert 'many species are hermaphroditic, although Schistosoma flukes have separate sexes' in adaptations
          assert 'ஸ்போரோசிஸ்ட் மற்றும் ரெடியா நிலைகள் பாலிலா முறையில் பெருகிப் புதிய லார்வாக்களை உருவாக்குகின்றன' in adaptations
          assert 'மெட்டாசெர்க்கேரியா நிலைக்கு மாறும்போது பாலூட்டியைத் தொற்றும் திறனைப் பெறுகின்றன' in adaptations
          assert 'மிராசிடியம் குறுஇழைகள் (cilia) கொண்ட' in adaptations
          assert 'taeniasis' in adaptations and 'cysticercosis' in adaptations
          assert 'நரம்பியல் பாதிப்புகள் ஏற்படக்கூடும்' in adaptations
          assert 'ஒரு பரப்பில் கூடு கட்டிய மெட்டாசெர்க்காரியா' not in adaptations
          assert 'அனைத்து விலங்குகளும் ஒரே தனிப்பட்ட இயற்கை மரபுக் குழுவை உருவாக்குவதில்லை' in nematoda
          assert 'நீரழுத்த எலும்புக்கூடு (hydrostatic skeleton)' in nematoda
          assert 'Parasitic nematode life cycles may be direct' in nematoda
          assert 'skin penetration is a route of infection, not a third life-cycle category' in nematoda
          assert 'தனியான மூன்றாவது வாழ்க்கைச் சுழற்சி வகை அல்ல' in nematoda
          assert 'நெமட்டோடா மற்றும் மண்புழுவின் இயக்க ஒப்பீடு' in nematoda
          assert 'The eggs pass out in the faeces unembryonated.' in ascaris
          assert 'கருவுற்ற முட்டைகள் ஏற்ற வெப்பமும் ஈரப்பதமும் உள்ள மண்ணில்' in ascaris
          assert 'scientific review pending' not in ascaris
          assert 'அறிவியல் சரிபார்ப்பு நிலுவையில் உள்ளது' not in ascaris
          assert 'ஆண்புழுவில் குடலும் இனப்பெருக்கக் குழாயும் குளோயாக்காவில் திறக்கின்றன' in ascaris
          assert 'it does not involve an intermediate host.' in ascaris
          assert 'இளவுயிரி கொண்ட முட்டை (Larvated egg)' in ascaris
          assert 'நீரழுத்த எலும்புக்கூடாகச் செயல்படுகிறது' in ascaris
          assert 'both a developmental intermediate host and a vector' in nematode_parasites
          assert 'deposited on the skin during a later mosquito blood meal' in nematode_parasites
          assert 'கொசு கடித்த காயம் வழியாக உடலுக்குள் நுழைகின்றன' in nematode_parasites
          assert 'இடைநிலை விருந்தோம்பியாகவும் நோய்க்கடத்தியாகவும் செயல்படுகிறது' in nematode_parasites
          assert 'மூன்றில் எதற்கும் ட்ரீமட்டோடா, செஸ்டோடாவில்' not in nematode_parasites
          assert 'ஊசிப்புழு எனப்படும் சிறிய வெள்ளை நிற நெமட்டோடா' in nematode_parasites
          assert 'சீக்கம் (caecum) பகுதியை அடைந்து' in nematode_parasites
          assert 'autoinfection' in nematode_parasites
          assert 'ஏறத்தாழ 5–10 நாட்களில் இரண்டு முறை தோலுரித்த பிறகு' in nematode_parasites
          assert 'ஃபைலேரிஃபார்ம் (L3) லார்வாக்களாக' in nematode_parasites
          assert 'குடற்புழுத் தொற்றின் வழக்கமான அறிகுறி' not in nematode_parasites
          assert 'மிகப் பெரிய எண்ணிக்கையிலான தொற்றும் லார்வாக்களைத் தருகிறது' not in fasciola
          print('TAMIL_EDIT_CORRECTIONS=PASS; INDEPENDENT_EDITORIAL_ACCEPTANCE=NOT_CLAIMED')
          PY
      - name: Compile and test exact active branch
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit23-editorial-jvm-evidence
          path: native-app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  android-api34:
    needs: kotlin-and-jvm
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real offline Android textbook acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-unit23-editorial-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit23-editorial-api34-en-ta-100-200
          path: qa-evidence/unit23-editorial/
          if-no-files-found: warn
