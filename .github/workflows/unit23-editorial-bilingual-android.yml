name: Unit II-III textbook bilingual Android acceptance
on:
  push:
    branches: ['feat/plate-pipeline', 'claude/audit-l10n', 'claude/fix-home-label-tests', 'fix/tamil-porifera-reader-bilingual-20261118']
    paths:
      - 'native-app/**'
      - '.github/scripts/run-unit23-editorial-qa.sh'
      - '.github/workflows/unit23-editorial-bilingual-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit23-textbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-and-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Check Bash syntax
        run: bash -n .github/scripts/run-unit23-editorial-qa.sh
      - name: Guard corrected scientific Tamil and amphiblastula stage sequence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('native-app/app/src/main/java/com/gasczoology/invertebratelab/data')
          reproduction = (root / 'PoriferaReproductionBookChapter.kt').read_text(encoding='utf-8')
          cnidaria = (root / 'CnidariaBookChapter.kt').read_text(encoding='utf-8')
          obelia = (root / 'ObeliaBookChapter.kt').read_text(encoding='utf-8')
          assert 'Embryonic inversion exposes the cilia before the amphiblastula is released' in reproduction
          assert 'கருவளர்ச்சிக் காலப் புரட்டலால் ஆம்ஃபிபிளாஸ்டுலா' in reproduction
          assert 'inversion brings the flagellated cells to the inside' not in reproduction.lower()
          assert 'புரட்டல் கசையிழை செல்களை உள்ளே கொண்டு வருகிறது' not in reproduction
          assert 'போர்த்துக்கீசிய போர்க்கப்பல் மீனும்' not in cnidaria
          assert 'பைசாலியா (Physalia) காலனி நிடேரிய உயிரி' in cnidaria
          assert 'எப்பிதீலியோதசை' not in cnidaria
          assert 'கூட்டுயிரி' not in obelia
          assert 'கசைகள் உள்ளடக்கத்தைக் கலக்குதல்' not in obelia
          assert 'காலனி' in obelia and 'பாலியல் இனப்பெருக்கம்' in obelia
          print('TAMIL_EDIT_CORRECTIONS=PASS; INDEPENDENT_EDITORIAL_ACCEPTANCE=NOT_CLAIMED')
          PY
      - name: Compile and test exact active branch
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit23-editorial-jvm-evidence
          path: native-app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  android-api34:
    needs: kotlin-and-jvm
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real offline Android textbook acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-unit23-editorial-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit23-editorial-api34-en-ta-100-200
          path: qa-evidence/unit23-editorial/
          if-no-files-found: warn
