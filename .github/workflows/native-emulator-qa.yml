name: Native emulator acceptance QA

on:
  workflow_dispatch:
  push:
    branches:
      - audit/undergraduate-coverage-register-20261114
    paths:
      - '.github/workflows/native-emulator-qa.yml'
      - 'Paramecium_Approved_Integration_Kit.zip'
      - 'tools/verify_approved_paramecium.py'
      - 'tools/run_native_emulator_qa.sh'
      - 'native-app/app/src/main/java/**'
      - 'native-app/app/src/main/assets/**'
      - 'native-app/app/src/main/res/**'
      - 'native-app/app/src/androidTest/**'
      - 'native-app/app/src/test/java/**/BookReadingPageCoverageTest.kt'
      - 'native-app/app/src/test/java/**/BookChapterContractTest.kt'
      - 'native-app/app/build.gradle.kts'
      - 'native-app/build.gradle.kts'

permissions:
  contents: read

jobs:
  emulator-smoke:
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
        font_scale: ['1.0', '2.0']
        suite: [full]
        include:
          - api: 34
            font_scale: '2.0'
            suite: rotation
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify committed Paramecium image before emulator
        run: python3 tools/verify_approved_paramecium.py
      - name: Enable KVM for Android emulator
        run: |
          if [ ! -e /dev/kvm ]; then
            echo 'BLOCKED: /dev/kvm unavailable on this runner' >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
      - name: Capture ADB environment before emulator startup
        run: |
          mkdir -p native-app/app/build/qa-evidence
          {
            echo "PATH=$PATH"
            if command -v adb >/dev/null 2>&1; then
              command -v adb
              adb version
            else
              echo "ADB is not on PATH before android-emulator-runner sets up Android SDK tools"
            fi
            id
            ls -l /dev/kvm
            ps -eo pid,ppid,user,args | grep -E '[a]db|[e]mulator' || true
            ss -ltnp '( sport = :5037 )' || true
          } > native-app/app/build/qa-evidence/adb-preflight.txt 2>&1
      - name: Run actual Android instrumentation tests on emulator
        timeout-minutes: 55
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash tools/run_native_emulator_qa.sh ${{ matrix.font_scale }} ${{ matrix.suite }}
      - name: Collect bounded post-failure diagnostics
        if: always()
        timeout-minutes: 2
        run: |
          mkdir -p native-app/app/build/qa-evidence
          timeout --signal=TERM --kill-after=5s 25s adb -s emulator-5554 logcat -d -v threadtime > native-app/app/build/qa-evidence/logcat-final.txt 2>&1 || true
      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invertebrata-emulator-evidence-${{ github.sha }}-api${{ matrix.api }}-font${{ matrix.font_scale }}-${{ matrix.suite }}
          path: |
            native-app/app/build/outputs/androidTest-results/
            native-app/app/build/reports/androidTests/
            native-app/app/build/qa-evidence/
          if-no-files-found: warn
          retention-days: 14
