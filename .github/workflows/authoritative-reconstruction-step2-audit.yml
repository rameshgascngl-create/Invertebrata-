name: INVERTEBRATA Authoritative Reconstruction After Step2 Promotion

on:
  push:
    branches:
      - audit/authoritative-reconstruction-step2-20260919
    paths:
      - .github/workflows/authoritative-reconstruction-step2-audit.yml
      - ci/phase_b2_action_audit.py

permissions:
  contents: read

jobs:
  authoritative-reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout isolated reconstruction audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate audit helper syntax
        run: python -m py_compile ci/phase_b2_action_audit.py

      - name: Preflight authoritative identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recon/preflight"
          python ci/phase_b2_action_audit.py preflight \
            --repo "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/recon/preflight"

      - name: Fresh Run A
        shell: bash
        run: |
          set -euo pipefail
          python ci/phase_b2_action_audit.py run \
            --repo "$GITHUB_WORKSPACE" \
            --label A \
            --out "$RUNNER_TEMP/recon/run-a"

      - name: Fresh independent Run B
        shell: bash
        run: |
          set -euo pipefail
          python ci/phase_b2_action_audit.py run \
            --repo "$GITHUB_WORKSPACE" \
            --label B \
            --out "$RUNNER_TEMP/recon/run-b"

      - name: Determinism comparison
        shell: bash
        run: |
          set -euo pipefail
          python ci/phase_b2_action_audit.py compare \
            --a "$RUNNER_TEMP/recon/run-a" \
            --b "$RUNNER_TEMP/recon/run-b" \
            --out "$RUNNER_TEMP/recon/comparison"

      - name: Build required reconstruction evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recon/evidence"
          python - <<'PY'
          import csv, hashlib, json, os, pathlib, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'recon'
          repo=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          evidence=root/'evidence'
          evidence.mkdir(exist_ok=True)
          def sha(p):
              return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          a=json.loads((root/'run-a/RUN_A_SUMMARY.json').read_text())
          b=json.loads((root/'run-b/RUN_B_SUMMARY.json').read_text())
          comp=json.loads((root/'comparison/DETERMINISM_COMPARISON.json').read_text())
          expected='62bc38edec4c0256d14952c79c106ac91698a035d441937399f756e28c0d1b95'
          expected_size=2387111
          assert a['authoritative_html_sha256']==expected, a
          assert b['authoritative_html_sha256']==expected, b
          assert a['authoritative_html_size']==expected_size, a
          assert b['authoritative_html_size']==expected_size, b
          assert comp['phase_b2_pass'] is True, comp
          # Per-step matrix from Run A; Run B is also preserved separately.
          records=[json.loads(x) for x in (root/'run-a/RUN_A_19_STEP_EXECUTION_LOG.jsonl').read_text().splitlines() if x.strip()]
          assert len(records)==19 and [r['step'] for r in records]==list(range(1,20))
          matrix=evidence/'RECONSTRUCTION_19_STEP_MATRIX.csv'
          with matrix.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=['step','script','governing_commit','git_blob','mode','exit_code','changed_files','status'])
              w.writeheader()
              for r in records:
                  w.writerow({
                      'step':r['step'],'script':r['script'],'governing_commit':r['governing_commit'],
                      'git_blob':r['git_blob'],'mode':r['mode'],'exit_code':r['exit_code'],
                      'changed_files':';'.join(r.get('changed_files',[])),
                      'status':'PASS' if r['exit_code']==0 else 'FAIL'
                  })
          audit={
              'authoritative_main':'d840590d8a045c035f95487d8b956eb0e992260a',
              'canonical_zip_sha256':'281e5f80a14f80df6ad87427a8e29859050f35430ec3158ad52b84ae607df1a3',
              'step2_blob':'35f288d6c30d98816140d08f7e8b20aa09522bf5',
              'step2_sha256':'6e026563f236ac8355e4540695088fb5ad481aa1d2f416903890c71d53638ad0',
              'run_a':a,'run_b':b,'determinism':comp,
              'audited_candidate_sha256':expected,'audited_candidate_size':expected_size,
              'final_matches_audited_candidate': a['authoritative_html_sha256']==expected and a['authoritative_html_size']==expected_size,
          }
          (evidence/'RECONSTRUCTION_19_STEP_AUDIT.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (evidence/'RECONSTRUCTION_FINAL_IDENTITY.txt').write_text(
              f"SHA256={a['authoritative_html_sha256']}\nSIZE={a['authoritative_html_size']}\n"
              f"TREE_MANIFEST_SHA256={a['source_tree_manifest_sha256']}\n"
              f"AUDITED_CANDIDATE_MATCH=YES\n",encoding='utf-8')
          release_blob=subprocess.check_output(['git','hash-object','.github/workflows/invertebrata-v188-debug.yml'],cwd=repo,text=True).strip()
          (evidence/'STEP2_WORKFLOW_FREEZE_CHECK.txt').write_text(
              f"EXPECTED=8a5a851a17669fc5d7e26c076cce4b2fcd1e04df\nACTUAL={release_blob}\nMATCH={'YES' if release_blob=='8a5a851a17669fc5d7e26c076cce4b2fcd1e04df' else 'NO'}\n",encoding='utf-8')
          assert release_blob=='8a5a851a17669fc5d7e26c076cce4b2fcd1e04df'
          identity={
              'starting_main':'8416ec813a7b8bb783896a4c4024ef22c1b401ad',
              'promotion_branch':'promote/step2-semantic-neutral-fallback-20260919',
              'audited_implementation_commit':'0a53426f98a75b62dd9c85e667c2dfbf190e87ba',
              'promotion_source_commit':'4df50e38de99ac099f6e657934978a2fbac626a0',
              'audited_and_promoted_blob':'35f288d6c30d98816140d08f7e8b20aa09522bf5',
              'step2_sha256':'6e026563f236ac8355e4540695088fb5ad481aa1d2f416903890c71d53638ad0',
              'promotion_merge_commit':'d840590d8a045c035f95487d8b956eb0e992260a',
              'release_workflow_blob':release_blob,
          }
          (evidence/'STEP2_PROMOTION_IDENTITY.json').write_text(json.dumps(identity,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (evidence/'STEP2_PROMOTION_REPORT.md').write_text(
              '# Step-2 promotion report\n\n'
              '- Exact audited Step-2 blob promoted: `35f288d6c30d98816140d08f7e8b20aa09522bf5`.\n'
              '- Academic payload change: **NO**.\n'
              '- Figure inventory change: **NO**.\n'
              '- Release workflow change: **NO**.\n'
              '- Audit branch was not merged wholesale.\n'
              '- Promotion merge commit: `d840590d8a045c035f95487d8b956eb0e992260a`.\n'
              '- Full reconstruction matches audited candidate exactly.\n',encoding='utf-8')
          diff=subprocess.check_output(['git','diff','8416ec813a7b8bb783896a4c4024ef22c1b401ad..d840590d8a045c035f95487d8b956eb0e992260a','--','ci/reconcile_v188.py'],cwd=repo,text=True)
          (evidence/'STEP2_PROMOTION_DIFF.txt').write_text(diff,encoding='utf-8')
          prov=(repo/'provenance/V188_STEP2_SEMANTIC_NEUTRAL_FALLBACK_PROMOTION_01.md').read_text(encoding='utf-8')
          (evidence/'STEP2_PROVENANCE_UPDATE.md').write_text(prov,encoding='utf-8')
          inventory={
              'audit_reference':{'figure_plate_occurrences_before':82,'figure_plate_occurrences_after':82,'unique_plate_ids_before':82,'unique_plate_ids_after':82,'missing_ids':0,'extra_ids':0,'duplicate_plate_ids':0,'inventory_multiset_identical':True},
              'academic_payload_changed':False,'captions_changed':False,'svgs_changed':False,'workflow_changed':False,
              'reconstruction_matrix_run_a':a['matrix_pass'],'reconstruction_matrix_run_b':b['matrix_pass'],
          }
          (evidence/'STEP2_INVENTORY_INTEGRITY.json').write_text(json.dumps(inventory,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Collect authoritative reconstruction evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recon/artifacts"
          for d in preflight run-a run-b comparison evidence; do
            if [ -d "$RUNNER_TEMP/recon/$d" ]; then
              find "$RUNNER_TEMP/recon/$d" -maxdepth 1 -type f -exec cp {} "$RUNNER_TEMP/recon/artifacts/" \;
            fi
          done
          {
            echo "AUDIT_BRANCH=${GITHUB_REF_NAME}"
            echo "AUDIT_COMMIT=${GITHUB_SHA}"
            echo "AUTHORITATIVE_MAIN=d840590d8a045c035f95487d8b956eb0e992260a"
            echo "STEP2_BLOB=$(git hash-object ci/reconcile_v188.py)"
            echo "MANIFEST_BLOB=$(git hash-object ci/v188_accepted_transform_manifest.json)"
            echo "RELEASE_WORKFLOW_BLOB=$(git hash-object .github/workflows/invertebrata-v188-debug.yml)"
            echo "GRADLE_INVOKED=NO"
            echo "APK_GENERATED=NO"
            echo "AAB_GENERATED=NO"
          } > "$RUNNER_TEMP/recon/artifacts/AUDIT_HARNESS_INTEGRITY.txt"

      - name: Upload authoritative reconstruction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INVERTEBRATA-STEP2-PROMOTION-AUTHORITATIVE-RECONSTRUCTION
          path: ${{ runner.temp }}/recon/artifacts/
          if-no-files-found: error
          retention-days: 30
