name: Unit I native diagram access - exact commit QA
'on':
  push:
    branches:
      - native/u1-diagram-access-recovery-20261014
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-unit1-diagram-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify Unit I artwork routing and protected A5 corpus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path("native-app/app/src/main/java/com/gasczoology/invertebratelab")
          nav=(source/"ui/InvertebrataApp.kt").read_text(encoding="utf-8")
          atlas=(source/"ui/ParameciumExternalCanvas.kt").read_text(encoding="utf-8")
          reader=(source/"ui/ParameciumTeachingLab.kt").read_text(encoding="utf-8")
          manifest=(source/"data/NativeCurriculumManifest.kt").read_text(encoding="utf-8")
          for marker in ["u1-open-diagram-atlas","u1-paramecium-open-diagrams",
                         "u1-missing-protozoa-plates","laboratoryTab = \"anatomy\"",
                         'Routes.PARAMECIUM']:
              assert marker in nav, marker
          assert "n23b-external-canvas" in atlas, "Retired Canvas prototype expected in history"
          active=reader.split('private fun AtlasSection(',1)[1].split('private fun VacuoleAtlasSection(',1)[0]
          assert "ParameciumRasterAtlas(" in active, "Anatomical atlas must use raster loader"
          assert "ParameciumExternalCanvas(" not in active, "Old anatomical Canvas still on active route"
          assert "AtlasSketch(" not in active and "VacuoleAtlasSection(" not in active
          raster=(source/"ui/ParameciumRasterAtlas.kt").read_text()
          assert "rememberRequiredRasterBitmap(" in raster
          assert "u1-raster-asset-missing" in raster
          assert "detectTransformGestures" in raster
          assert 'r1-atlas-heading' in reader
          assert 'EXISTING_A5_CHAPTER_COUNT = 43' in manifest
          for n in range(1,6):
              p=Path("native-app/app/src/main/assets/a5/U"+str(n)+"_A5_VALIDATED.json")
              assert p.is_file() and p.stat().st_size>0,p
          print("UNIT1_EXISTING_DIAGRAM_ROUTING=SOURCE_PASS")
          print("PARASITIC_PROTOZOAN_ORIGINAL_RASTER_MASTERS=NOT_AUTHORED")
          print("ACADEMIC_AND_PHYSICAL_DEVICE_APPROVAL=PENDING")
          PY
      - name: Build all four authenticated pencil-source PNG views
        run: |
          python3 -m venv /tmp/u1pencil
          /tmp/u1pencil/bin/pip install --disable-pip-version-check Pillow==11.3.0
          /tmp/u1pencil/bin/python ci/build_unit1_paramecium_pencil_masters.py
      - name: Preserve raster masters for exact-commit Android build
        uses: actions/upload-artifact@v4
        with:
          name: unit1-paramecium-png-masters
          path: native-app/app/src/main/assets/unit1/*.png
          if-no-files-found: error
      - name: Compile Kotlin, instrumented test sources and all JVM tests
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --stacktrace

  android-ui:
    needs: compile-and-corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Restore same-run source image masters before Android tests
        uses: actions/download-artifact@v4
        with:
          name: unit1-paramecium-png-masters
          path: native-app/app/src/main/assets/unit1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Unit I diagram routing at 100% and 200% fonts offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-unit1-diagram-access-audit.sh
      - name: Upload XML, raster screenshots and device logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit1-diagram-access-api34-evidence
          path: qa-evidence/unit1-diagrams/
          if-no-files-found: warn
      - name: Assemble native debug engineering APK
        if: success()
        run: gradle -p native-app :app:assembleDebug --stacktrace
      - name: Preserve QA debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unit1-diagram-access-debug-qa-apk
          path: native-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Block false academic-artwork acceptance
        if: always()
        run: |
          echo "Unit I: source-derived authentic pencil PNG candidate, NOT expert artwork acceptance."
          echo "Entamoeba, Trypanosoma, Leishmania, Plasmodium pencil masters: MISSING."
          echo "Independent zoological review, raster quality, image hotspots, Tamil and physical-device QA: OPEN."
          echo "No app store release or promotion authorized by this workflow."
