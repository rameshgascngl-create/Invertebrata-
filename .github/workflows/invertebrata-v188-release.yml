name: INVERTEBRATA v1.8.8 Signed Production Release

# Production release is manual only and requires an explicit physical-device-QA acknowledgement.
on:
  workflow_dispatch:
    inputs:
      device_qa_gate:
        description: "Type DEVICE_QA_PASS only after the exact v1.8.8 debug APK passes physical-device QA"
        required: true
        type: string
      debug_apk_sha256:
        description: "SHA-256 of the exact debug APK that passed physical-device QA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_HTML_SHA256: bdb39d4fa1f438c5de83fc9a84ab33905016854c1f641227dbc23063c14c2c46
      EXPECTED_HTML_SIZE: "2393951"
      EXPECTED_TREE_MANIFEST_SHA256: dbcf20925081e3ba67e3a2e4110f8c5fff619d237c262a8bd47d507de3358544
      EXPECTED_TRANSFORMS: "20"

    steps:
      - name: Enforce main branch and physical-device QA gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ inputs.device_qa_gate }}" = "DEVICE_QA_PASS"
          printf '%s' "${{ inputs.debug_apk_sha256 }}" | grep -Eq '^[0-9A-Fa-f]{64}$'
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            echo "SOURCE_REF=${{ github.ref }}"
            echo "SOURCE_COMMIT=${{ github.sha }}"
            echo "DEVICE_QA_GATE=PASS"
            echo "QA_PASSED_DEBUG_APK_SHA256=${{ inputs.debug_apk_sha256 }}"
          } > "$RUNNER_TEMP/evidence/RELEASE_GATE.txt"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify accepted reconstruction controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/reconcile_v188.py)" = "1161c46184c3d69530c1cad74db774734b4947af"
          test "$(git hash-object ci/reconstruct_v188_accepted_source.py)" = "0e1cd3a39567dde00b94c770a070696218cedd02"
          test "$(git hash-object ci/v188_accepted_transform_manifest.json)" = "041e04c306df454d0ec14c06d48eda39fce30dde"
          test "$(git hash-object ci/v188_contextual_academic_remap_step20.py)" = "3247e5c2dac58f9c779c6282ca4203722daa206c"
          test "$(git hash-object provenance/V188_SOURCE_GATE_MATRIX_02.csv)" = "958c8bacd91600213b64bb591027eafaf118a7f8"
          python ci/reconstruct_v188_accepted_source.py preflight --repo-root "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/evidence/PREFLIGHT.txt"
          grep -Fx "PHASE_B1_PREFLIGHT=PASS" "$RUNNER_TEMP/evidence/PREFLIGHT.txt"
          grep -Fx "ACCEPTED_TRANSFORMS_AVAILABLE=$EXPECTED_TRANSFORMS" "$RUNNER_TEMP/evidence/PREFLIGHT.txt"
          grep -Fx "SUPERSEDED_EXECUTABLE_TRANSFORMS=0" "$RUNNER_TEMP/evidence/PREFLIGHT.txt"
          grep -Fx "MATRIX_ROWS=76" "$RUNNER_TEMP/evidence/PREFLIGHT.txt"

      - name: Reconstruct accepted source Run A
        id: runa
        shell: bash
        run: |
          set -euo pipefail
          python ci/reconstruct_v188_accepted_source.py reconstruct \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/reconstruct-A" \
            --output "$RUNNER_TEMP/evidence/RUN_A.html" \
            | tee "$RUNNER_TEMP/evidence/RUN_A.log"
          grep -Fx "ACCEPTED_TRANSFORMS_EXECUTED=$EXPECTED_TRANSFORMS" "$RUNNER_TEMP/evidence/RUN_A.log"
          grep -Fx "SUPERSEDED_TRANSFORMS_EXECUTED=0" "$RUNNER_TEMP/evidence/RUN_A.log"
          root="$(find "$RUNNER_TEMP/reconstruct-A/extracted" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$root"
          test -f "$root/settings.gradle"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Reconstruct accepted source Run B
        shell: bash
        run: |
          set -euo pipefail
          python ci/reconstruct_v188_accepted_source.py reconstruct \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/reconstruct-B" \
            --output "$RUNNER_TEMP/evidence/RUN_B.html" \
            | tee "$RUNNER_TEMP/evidence/RUN_B.log"
          grep -Fx "ACCEPTED_TRANSFORMS_EXECUTED=$EXPECTED_TRANSFORMS" "$RUNNER_TEMP/evidence/RUN_B.log"
          grep -Fx "SUPERSEDED_TRANSFORMS_EXECUTED=0" "$RUNNER_TEMP/evidence/RUN_B.log"

      - name: Authoritative source identity gate
        shell: bash
        run: |
          set -euo pipefail
          ROOT_A="${{ steps.runa.outputs.root }}"
          ROOT_B="$(find "$RUNNER_TEMP/reconstruct-B/extracted" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$ROOT_B"
          cmp "$RUNNER_TEMP/evidence/RUN_A.html" "$RUNNER_TEMP/evidence/RUN_B.html"
          test "$(sha256sum "$RUNNER_TEMP/evidence/RUN_A.html" | awk '{print $1}')" = "$EXPECTED_HTML_SHA256"
          test "$(stat -c %s "$RUNNER_TEMP/evidence/RUN_A.html")" = "$EXPECTED_HTML_SIZE"
          cmp "$RUNNER_TEMP/evidence/RUN_A.html" "$ROOT_A/academic_payload/index.html"
          cmp "$ROOT_A/academic_payload/index.html" "$ROOT_A/app/src/main/assets/www/index.html"
          cmp "$ROOT_B/academic_payload/index.html" "$ROOT_B/app/src/main/assets/www/index.html"
          grep -q "versionCode 18800" "$ROOT_A/app/build.gradle"
          grep -q "versionName '1.8.8'" "$ROOT_A/app/build.gradle"
          grep -q 'applicationId "com.gasczoology.invertebratelab"' "$ROOT_A/app/build.gradle"
          grep -q 'minSdk 24' "$ROOT_A/app/build.gradle"
          grep -q 'targetSdk 36' "$ROOT_A/app/build.gradle"
          grep -q 'android:allowBackup="false"' "$ROOT_A/app/src/main/AndroidManifest.xml"
          grep -q 'android:usesCleartextTraffic="false"' "$ROOT_A/app/src/main/AndroidManifest.xml"
          ! grep -q 'android.permission.INTERNET' "$ROOT_A/app/src/main/AndroidManifest.xml"

          python - "$ROOT_A" "$ROOT_B" "$RUNNER_TEMP/evidence" "$EXPECTED_TREE_MANIFEST_SHA256" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          a = Path(sys.argv[1])
          b = Path(sys.argv[2])
          out = Path(sys.argv[3])
          expected = sys.argv[4]

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def manifest(root):
              rows = []
              for path in sorted(x for x in root.rglob("*") if x.is_file()):
                  rel = path.relative_to(root).as_posix()
                  rows.append((rel, path.stat().st_size, sha(path)))
              payload = "".join(f"{h}  {size}  {rel}\n" for rel, size, h in rows)
              return hashlib.sha256(payload.encode()).hexdigest(), payload, len(rows)

          ma, ta, na = manifest(a)
          mb, tb, nb = manifest(b)
          assert ma == mb == expected, (ma, mb, expected)
          assert ta == tb
          assert na == nb == 42, (na, nb)
          (out / "RUN_A_TREE_MANIFEST.txt").write_text(ta)
          (out / "RUN_B_TREE_MANIFEST.txt").write_text(tb)
          (out / "SOURCE_GATE.txt").write_text(
              "AUTHORITATIVE_HTML_SHA256=bdb39d4fa1f438c5de83fc9a84ab33905016854c1f641227dbc23063c14c2c46\n"
              "AUTHORITATIVE_HTML_SIZE=2393951\n"
              "SOURCE_TREE_MANIFEST_SHA256=" + ma + "\n"
              "SOURCE_TREE_FILE_COUNT=" + str(na) + "\n"
              "BYTE_IDENTICAL_RECONSTRUCTION=PASS\n"
              "ACCEPTED_TRANSFORMS_EXECUTED=20\n"
              "SUPERSEDED_TRANSFORMS_EXECUTED=0\n"
              "PRODUCTION_SOURCE_GATE=PASS\n"
          )
          PY

      - name: Require permanent Invertebrata signing identity
        shell: bash
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          EXPECTED_CERT_SHA256: ${{ secrets.INVERTEBRATA_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"
          test -n "$KS_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"
          test -n "$EXPECTED_CERT_SHA256"

          mkdir -p "$RUNNER_TEMP/signing" "$RUNNER_TEMP/release"
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/signing/invertebrata-release.keystore"
          chmod 600 "$RUNNER_TEMP/signing/invertebrata-release.keystore"

          keytool -list -keystore "$RUNNER_TEMP/signing/invertebrata-release.keystore" \
            -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null

          keytool -exportcert \
            -keystore "$RUNNER_TEMP/signing/invertebrata-release.keystore" \
            -storepass "$KS_PASS" \
            -alias "$KEY_ALIAS" \
            -rfc \
            | openssl x509 -noout -subject -fingerprint -sha256 \
            | tee "$RUNNER_TEMP/evidence/EXPECTED_RELEASE_CERTIFICATE.txt"

          actual="$(grep -i 'fingerprint=' "$RUNNER_TEMP/evidence/EXPECTED_RELEASE_CERTIFICATE.txt" | sed 's/.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          printf '%s' "$expected" | grep -Eq '^[0-9A-F]{64}$'
          test "$actual" = "$expected"
          ! grep -qi 'Android Debug' "$RUNNER_TEMP/evidence/EXPECTED_RELEASE_CERTIFICATE.txt"
          echo "PERMANENT_CERTIFICATE_PIN=PASS" >> "$RUNNER_TEMP/evidence/RELEASE_GATE.txt"

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''

      - name: Install Android 36 tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '8.14.3'
          cache-read-only: true

      - name: Clean production release build
        shell: bash
        working-directory: ${{ steps.runa.outputs.root }}
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.14.3 --distribution-type bin
          chmod +x gradlew
          ./gradlew --no-daemon clean lint test assembleRelease bundleRelease --stacktrace

      - name: Sign APK and AAB with permanent release key
        id: sign
        shell: bash
        working-directory: ${{ steps.runa.outputs.root }}
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -euo pipefail
          unsigned_apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          unsigned_aab="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$unsigned_apk"
          test -n "$unsigned_aab"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 \
            "$unsigned_apk" \
            "$RUNNER_TEMP/release/INVERTEBRATA-v1.8.8-release-aligned.apk"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/signing/invertebrata-release.keystore" \
            --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            --out "$RUNNER_TEMP/release/INVERTEBRATA-v1.8.8-release.apk" \
            "$RUNNER_TEMP/release/INVERTEBRATA-v1.8.8-release-aligned.apk"

          rm "$RUNNER_TEMP/release/INVERTEBRATA-v1.8.8-release-aligned.apk"

          cp "$unsigned_aab" "$RUNNER_TEMP/release/INVERTEBRATA-v1.8.8-release.aab"
          jarsigner \
            -keystore "$RUNNER_TEMP/signing/invertebrata-release.keystore" \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$RUNNER_TEMP/release/INVERTEBRATA-v1.8.8-release.aab" \
            "$KEY_ALIAS"

          echo "apk=$RUNNER_TEMP/release/INVERTEBRATA-v1.8.8-release.apk" >> "$GITHUB_OUTPUT"
          echo "aab=$RUNNER_TEMP/release/INVERTEBRATA-v1.8.8-release.aab" >> "$GITHUB_OUTPUT"

      - name: Verify actual signed production artifacts
        shell: bash
        env:
          APK: ${{ steps.sign.outputs.apk }}
          AAB: ${{ steps.sign.outputs.aab }}
          EXPECTED_CERT_SHA256: ${{ secrets.INVERTEBRATA_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK" | tee "$RUNNER_TEMP/evidence/ZIPALIGN.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/evidence/APKSIGNER.txt"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/evidence/APKSIGNER.txt"
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/evidence/APKSIGNER.txt"

          actual="$(grep -i 'certificate SHA-256 digest:' "$RUNNER_TEMP/evidence/APKSIGNER.txt" | head -1 | sed 's/.*: //' | tr -d ':' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          test "$actual" = "$expected"
          ! grep -qi 'Android Debug' "$RUNNER_TEMP/evidence/APKSIGNER.txt"

          jarsigner -verify -strict -verbose -certs "$AAB" > "$RUNNER_TEMP/evidence/AAB_SIGNATURE.txt"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/evidence/BADGING.txt"
          grep -q "package: name='com.gasczoology.invertebratelab'" "$RUNNER_TEMP/evidence/BADGING.txt"
          grep -q "versionCode='18800'" "$RUNNER_TEMP/evidence/BADGING.txt"
          grep -q "versionName='1.8.8'" "$RUNNER_TEMP/evidence/BADGING.txt"
          grep -q "sdkVersion:'24'" "$RUNNER_TEMP/evidence/BADGING.txt"
          grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/evidence/BADGING.txt"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/evidence/PERMISSIONS.txt"
          ! grep -q "android.permission.INTERNET" "$RUNNER_TEMP/evidence/PERMISSIONS.txt"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/evidence/MANIFEST_XMLTREE.txt"
          python - "$RUNNER_TEMP/evidence/MANIFEST_XMLTREE.txt" <<'PY'
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors="replace")

          def lines(name):
              return [x for x in text.splitlines() if f"android:{name}" in x]

          dbg = lines("debuggable")
          assert not any("0xffffffff" in x.lower() or "true" in x.lower() for x in dbg), dbg

          backup = lines("allowBackup")
          assert backup and any("0x0" in x.lower() or "false" in x.lower() for x in backup), backup

          clear = lines("usesCleartextTraffic")
          assert clear and any("0x0" in x.lower() or "false" in x.lower() for x in clear), clear
          PY

          test "$(unzip -l "$APK" | grep -c 'assets/www/index.html')" = "1"
          unzip -p "$APK" assets/www/index.html > "$RUNNER_TEMP/evidence/APK_INDEX.html"
          test "$(sha256sum "$RUNNER_TEMP/evidence/APK_INDEX.html" | awk '{print $1}')" = "$EXPECTED_HTML_SHA256"
          test "$(stat -c %s "$RUNNER_TEMP/evidence/APK_INDEX.html")" = "$EXPECTED_HTML_SIZE"

          sha256sum "$APK" "$AAB" | tee "$RUNNER_TEMP/evidence/RELEASE_ARTIFACT_SHA256.txt"
          stat -c '%n %s bytes' "$APK" "$AAB" | tee "$RUNNER_TEMP/evidence/RELEASE_ARTIFACT_SIZE.txt"

          {
            echo "SIGNED_RELEASE_BUILD=PASS"
            echo "PERMANENT_SIGNING=PASS"
            echo "VERSION_CONSISTENCY=PASS"
            echo "V2_SIGNING=PASS"
            echo "V3_SIGNING=PASS"
            echo "OFFLINE_PAYLOAD=PASS"
            echo "PERMISSIONS_AUDIT=PASS"
            echo "STATIC_APK_AUDIT=PASS"
            echo "RELEASE_ARTIFACT_DEVICE_QA=NOT_PERFORMED"
            echo "STORE_SUBMISSION=BLOCKED_PENDING_RELEASE_DEVICE_QA"
          } > "$RUNNER_TEMP/evidence/FINAL_RELEASE_STATIC_GATE.txt"

      - name: Upload signed production artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INVERTEBRATA-v1.8.8-SIGNED-PRODUCTION
          path: |
            ${{ steps.sign.outputs.apk }}
            ${{ steps.sign.outputs.aab }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload production release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INVERTEBRATA-v1.8.8-PRODUCTION-RELEASE-EVIDENCE
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 30
