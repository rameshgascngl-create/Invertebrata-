name: Unit V Pila Asterias bilingual Android evidence
'on':
  push:
    branches:
      - native/u61-unit5-bilingual-android-proof-20261020
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: u61-unit5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manuscript-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile exact Kotlin and Android test sources and enforce 43 chapter/44 teaching slot contracts
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --stacktrace
      - name: Retain native JVM coverage XML for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u61-43chapter-unit5-jvm-xml
          path: native-app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Assemble nonproduction debug APK
        run: gradle -p native-app :app:assembleDebug --stacktrace
      - name: Retain unit5 engineering handset candidate (unapproved)
        uses: actions/upload-artifact@v4
        with:
          name: u61-unit5-UNAPPROVED-debug-apk
          path: native-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  api34-unit5-ui:
    needs: manuscript-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate Pila and Asterias readers at English/Tamil 100% and 200%, offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-u61-unit5-bilingual.sh
      - name: Preserve every screenshot, assertion XML and Android log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u61-unit5-android-100-200-evidence
          path: qa-evidence/u61-unit5/
          if-no-files-found: warn

  explicit-academic-hold:
    needs: [manuscript-and-build, api34-unit5-ui]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Do not classify emulator success as scientific or physical-device approval
        run: |
          echo "43 chapter manuscript gate: engineering only; biology and Tamil editorial signoff pending."
          echo "Pila/Asterias mandatory plate masters still missing or academically unapproved."
          echo "Full physical Android phone inspection not performed in GitHub."
          echo "Release remains HOLD."
