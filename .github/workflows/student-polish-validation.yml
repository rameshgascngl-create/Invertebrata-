name: Student polish native Android validation

on:
  workflow_dispatch:
  push:
    branches: ['claude/student-polish']
    paths:
      - 'native-app/**'
      - '.github/scripts/**'
      - '.github/workflows/student-polish-validation.yml'

permissions:
  contents: read

concurrency:
  group: student-polish-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Record and verify the pushed source revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD | tee source-commit.txt
          bash -n .github/scripts/run-unit1-intro-rendering.sh
          bash -n .github/scripts/run-unit23-editorial-qa.sh
          bash -n .github/scripts/run-unit45-gallery-qa.sh
          bash -n .github/scripts/run-pila-biology-qa.sh
      - name: Compile application and instrumented tests; run complete JVM suite
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --stacktrace
      - name: Preserve JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-polish-jvm-${{ github.sha }}
          path: |
            source-commit.txt
            native-app/app/build/test-results/testDebugUnitTest/
            native-app/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30

  api34-bilingual:
    needs: compile-and-jvm
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        suite: [unit1, unit23, unit45-pila]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Verify source revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD | tee source-commit.txt
      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run existing offline bilingual suites at both system font scales
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VALIDATION_SUITE: ${{ matrix.suite }}
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            if [ "$VALIDATION_SUITE" = unit1 ]; then bash .github/scripts/run-unit1-intro-rendering.sh; elif [ "$VALIDATION_SUITE" = unit23 ]; then bash .github/scripts/run-unit23-editorial-qa.sh; else bash .github/scripts/run-unit45-gallery-qa.sh && bash .github/scripts/run-pila-biology-qa.sh; fi
      - name: Preserve screenshots, instrumentation XML and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-polish-${{ matrix.suite }}-api34-${{ github.sha }}
          path: |
            source-commit.txt
            qa-evidence/
            native-app/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 30
