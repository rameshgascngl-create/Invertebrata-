name: INVERTEBRATA v1.8.8 Corrected Debug APK

# Illustration-development gate: do not build on source pushes.
# Re-enable/dispatch only after SVG CREATION + EMBEDDING + BIOLOGICAL/SOURCE AUDIT pass.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v188:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_ZIP: INVERTEBRATA_v1.8.7_RECONCILED_ANDROID_SOURCE.zip
      SOURCE_SHA256: 281e5f80a14f80df6ad87427a8e29859050f35430ec3158ad52b84ae607df1a3
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and extract frozen source
        id: src
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')" = "$SOURCE_SHA256"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/src"
          settings="$(find "$RUNNER_TEMP/src" -name settings.gradle -print -quit)"
          test -n "$settings"
          echo "root=$(dirname "$settings")" >> "$GITHUB_OUTPUT"
      - name: Apply proven R2 Android shell reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python ci/reconcile_r2.py "${{ steps.src.outputs.root }}" "$RUNNER_TEMP/r2.zip"
          test "$(sha256sum "$RUNNER_TEMP/r2.zip" | awk '{print $1}')" = "3f3ffd5d0b03da74b9f7b85cfc755883594aea3141149b1131ee11963d9a184a"
      - name: Apply v1.8.8 mobile display correction
        shell: bash
        run: |
          set -euo pipefail
          python ci/reconcile_v188.py "${{ steps.src.outputs.root }}" | tee "$RUNNER_TEMP/v188-payload.txt"
          cd "${{ steps.src.outputs.root }}"
          sha256sum -c provenance/SOURCE_MANIFEST_SHA256.txt
          grep -q "versionCode 18800" app/build.gradle
          grep -q "versionName '1.8.8'" app/build.gradle
      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''
      - name: Install Android 36 tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '8.14.3'
          cache-read-only: true
      - name: Restore wrapper and build corrected APK
        shell: bash
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.14.3 --distribution-type bin
          chmod +x gradlew
          ./gradlew --no-daemon clean lint test assembleDebug --stacktrace
      - name: Verify and stage APK
        shell: bash
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/INVERTEBRATA-v1.8.8-CORRECTED-DEBUG.apk"
          sha256sum "$RUNNER_TEMP/out/INVERTEBRATA-v1.8.8-CORRECTED-DEBUG.apk" | tee "$RUNNER_TEMP/out/SHA256.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | tee "$RUNNER_TEMP/out/BADGING.txt"
          grep -q "package: name='com.gasczoology.invertebratelab' versionCode='18800' versionName='1.8.8'" "$RUNNER_TEMP/out/BADGING.txt"
          cp "$RUNNER_TEMP/v188-payload.txt" "$RUNNER_TEMP/out/V188_PAYLOAD.txt"
      - name: Upload corrected debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INVERTEBRATA-v1.8.8-CORRECTED-DEBUG
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30
