name: INVERTEBRATA v1.8.8 Corrected Debug APK

# Source gate is complete. Build remains manual-dispatch only.
# Reconstruct the exact accepted 20-step source state before Gradle.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v188:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_ZIP: INVERTEBRATA_v1.8.7_RECONCILED_ANDROID_SOURCE.zip
      SOURCE_SHA256: 281e5f80a14f80df6ad87427a8e29859050f35430ec3158ad52b84ae607df1a3
      AUTHORITATIVE_HTML_SHA256: bdb39d4fa1f438c5de83fc9a84ab33905016854c1f641227dbc23063c14c2c46
      AUTHORITATIVE_HTML_SIZE: "2393951"
      AUTHORITATIVE_TREE_MANIFEST_SHA256: dbcf20925081e3ba67e3a2e4110f8c5fff619d237c262a8bd47d507de3358544

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify accepted reconstruction controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')" = "$SOURCE_SHA256"
          test "$(git hash-object ci/reconcile_v188.py)" = "1161c46184c3d69530c1cad74db774734b4947af"
          test "$(git hash-object ci/reconstruct_v188_accepted_source.py)" = "0e1cd3a39567dde00b94c770a070696218cedd02"
          test "$(git hash-object ci/v188_accepted_transform_manifest.json)" = "041e04c306df454d0ec14c06d48eda39fce30dde"
          test "$(git hash-object ci/v188_contextual_academic_remap_step20.py)" = "3247e5c2dac58f9c779c6282ca4203722daa206c"
          test "$(git hash-object provenance/V188_SOURCE_GATE_MATRIX_02.csv)" = "958c8bacd91600213b64bb591027eafaf118a7f8"
          python ci/reconstruct_v188_accepted_source.py preflight --repo-root "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/V188_PREFLIGHT.txt"
          grep -Fx "PHASE_B1_PREFLIGHT=PASS" "$RUNNER_TEMP/V188_PREFLIGHT.txt"
          grep -Fx "ACCEPTED_TRANSFORMS_AVAILABLE=20" "$RUNNER_TEMP/V188_PREFLIGHT.txt"
          grep -Fx "SUPERSEDED_EXECUTABLE_TRANSFORMS=0" "$RUNNER_TEMP/V188_PREFLIGHT.txt"
          grep -Fx "MATRIX_ROWS=76" "$RUNNER_TEMP/V188_PREFLIGHT.txt"

      - name: Reconstruct exact accepted source — Run A
        id: src
        shell: bash
        run: |
          set -euo pipefail
          python ci/reconstruct_v188_accepted_source.py reconstruct \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/reconstruct-A" \
            --output "$RUNNER_TEMP/V188_RUN_A.html" \
            | tee "$RUNNER_TEMP/V188_RUN_A.log"
          grep -Fx "ACCEPTED_TRANSFORMS_EXECUTED=20" "$RUNNER_TEMP/V188_RUN_A.log"
          grep -Fx "SUPERSEDED_TRANSFORMS_EXECUTED=0" "$RUNNER_TEMP/V188_RUN_A.log"
          grep -Fx "AUTHORITATIVE_SOURCE_CANDIDATE_SIZE=$AUTHORITATIVE_HTML_SIZE" "$RUNNER_TEMP/V188_RUN_A.log"
          grep -Fx "AUTHORITATIVE_SOURCE_CANDIDATE_SHA256=$AUTHORITATIVE_HTML_SHA256" "$RUNNER_TEMP/V188_RUN_A.log"
          root="$(find "$RUNNER_TEMP/reconstruct-A/extracted" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$root"
          test -f "$root/settings.gradle"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Reconstruct exact accepted source — Run B
        shell: bash
        run: |
          set -euo pipefail
          python ci/reconstruct_v188_accepted_source.py reconstruct \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/reconstruct-B" \
            --output "$RUNNER_TEMP/V188_RUN_B.html" \
            | tee "$RUNNER_TEMP/V188_RUN_B.log"
          grep -Fx "ACCEPTED_TRANSFORMS_EXECUTED=20" "$RUNNER_TEMP/V188_RUN_B.log"
          grep -Fx "SUPERSEDED_TRANSFORMS_EXECUTED=0" "$RUNNER_TEMP/V188_RUN_B.log"
          grep -Fx "AUTHORITATIVE_SOURCE_CANDIDATE_SIZE=$AUTHORITATIVE_HTML_SIZE" "$RUNNER_TEMP/V188_RUN_B.log"
          grep -Fx "AUTHORITATIVE_SOURCE_CANDIDATE_SHA256=$AUTHORITATIVE_HTML_SHA256" "$RUNNER_TEMP/V188_RUN_B.log"

      - name: Verify deterministic authoritative source tree
        shell: bash
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/V188_RUN_A.html" "$RUNNER_TEMP/V188_RUN_B.html"
          test "$(sha256sum "$RUNNER_TEMP/V188_RUN_A.html" | awk '{print $1}')" = "$AUTHORITATIVE_HTML_SHA256"
          test "$(stat -c %s "$RUNNER_TEMP/V188_RUN_A.html")" = "$AUTHORITATIVE_HTML_SIZE"
          ROOT_A="\${{ steps.src.outputs.root }}"
          ROOT_B="$(find "$RUNNER_TEMP/reconstruct-B/extracted" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$ROOT_B"
          cmp "$ROOT_A/academic_payload/index.html" "$ROOT_A/app/src/main/assets/www/index.html"
          cmp "$ROOT_B/academic_payload/index.html" "$ROOT_B/app/src/main/assets/www/index.html"
          test "$(sha256sum "$ROOT_A/academic_payload/index.html" | awk '{print $1}')" = "$AUTHORITATIVE_HTML_SHA256"
          test "$(sha256sum "$ROOT_B/academic_payload/index.html" | awk '{print $1}')" = "$AUTHORITATIVE_HTML_SHA256"
          python - "$ROOT_A" "$ROOT_B" "$RUNNER_TEMP" "$AUTHORITATIVE_TREE_MANIFEST_SHA256" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          a = Path(sys.argv[1])
          b = Path(sys.argv[2])
          tmp = Path(sys.argv[3])
          expected = sys.argv[4]

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def manifest(root):
              rows = []
              for path in sorted(x for x in root.rglob("*") if x.is_file()):
                  rel = path.relative_to(root).as_posix()
                  rows.append((rel, path.stat().st_size, sha(path)))
              payload = "".join(f"{h}  {size}  {rel}\n" for rel, size, h in rows)
              return hashlib.sha256(payload.encode()).hexdigest(), payload, len(rows)

          ma, ta, na = manifest(a)
          mb, tb, nb = manifest(b)
          assert ma == mb == expected, (ma, mb, expected)
          assert ta == tb
          assert na == nb == 42, (na, nb)
          (tmp / "V188_RUN_A_TREE_MANIFEST.txt").write_text(ta)
          (tmp / "V188_RUN_B_TREE_MANIFEST.txt").write_text(tb)
          print(f"RUN_A_TREE_MANIFEST_SHA256={ma}")
          print(f"RUN_B_TREE_MANIFEST_SHA256={mb}")
          print(f"SOURCE_TREE_FILE_COUNT={na}")
          PY
          grep -q "versionCode 18800" "$ROOT_A/app/build.gradle"
          grep -q "versionName '1.8.8'" "$ROOT_A/app/build.gradle"
          cmp "$ROOT_A/academic_payload/index.html" "$RUNNER_TEMP/V188_RUN_A.html"

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''

      - name: Install Android 36 tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '8.14.3'
          cache-read-only: true

      - name: Restore wrapper and build corrected APK
        shell: bash
        working-directory: \${{ steps.src.outputs.root }}
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.14.3 --distribution-type bin
          chmod +x gradlew
          ./gradlew --no-daemon clean lint test assembleDebug --stacktrace

      - name: Verify and stage APK
        shell: bash
        working-directory: \${{ steps.src.outputs.root }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/INVERTEBRATA-v1.8.8-CORRECTED-DEBUG.apk"
          sha256sum "$RUNNER_TEMP/out/INVERTEBRATA-v1.8.8-CORRECTED-DEBUG.apk" | tee "$RUNNER_TEMP/out/SHA256.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | tee "$RUNNER_TEMP/out/BADGING.txt"
          grep -q "package: name='com.gasczoology.invertebratelab' versionCode='18800' versionName='1.8.8'" "$RUNNER_TEMP/out/BADGING.txt"
          cp "$RUNNER_TEMP/V188_PREFLIGHT.txt" "$RUNNER_TEMP/out/"
          cp "$RUNNER_TEMP/V188_RUN_A.log" "$RUNNER_TEMP/out/"
          cp "$RUNNER_TEMP/V188_RUN_B.log" "$RUNNER_TEMP/out/"
          cp "$RUNNER_TEMP/V188_RUN_A_TREE_MANIFEST.txt" "$RUNNER_TEMP/out/"
          cp "$RUNNER_TEMP/V188_RUN_B_TREE_MANIFEST.txt" "$RUNNER_TEMP/out/"
          printf '%s\n' "$AUTHORITATIVE_HTML_SHA256  authoritative-reconstructed-index.html" > "$RUNNER_TEMP/out/AUTHORITATIVE_SOURCE_SHA256.txt"
          printf '%s\n' "$AUTHORITATIVE_TREE_MANIFEST_SHA256  reconstructed-source-tree-manifest" > "$RUNNER_TEMP/out/AUTHORITATIVE_TREE_SHA256.txt"

      - name: Upload corrected debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INVERTEBRATA-v1.8.8-CORRECTED-DEBUG
          path: \${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30
