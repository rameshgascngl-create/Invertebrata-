name: Stage provisional Paramecium conjugation PNG

on:
  workflow_dispatch:
  push:
    branches:
      - audit/undergraduate-coverage-register-20261114
    paths:
      - .github/workflows/stage-paramecium-conjugation.yml
      - tools/import_paramecium_conjugation_png.py
      - native-app/app/src/main/java/com/gasczoology/invertebratelab/data/BookFigureLibrary.kt
      - native-app/app/src/main/java/com/gasczoology/invertebratelab/data/ParameciumBookChapter.kt

permissions:
  contents: write

concurrency:
  group: paramecium-conjugation-intake
  cancel-in-progress: false

jobs:
  import-exact-png:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/undergraduate-coverage-register-20261114
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch pinned upload and import exact PNG
        run: |
          git fetch --no-tags origin 172eb188fdf5e42c0786286859e181d66dfecfea
          python3 tools/import_paramecium_conjugation_png.py
          python3 tools/verify_paramecium_conjugation_intake.py native-app/app/src/main/assets/paramecium/conjugation-provisional.png
      - name: Commit only the provisional image if new
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- native-app/app/src/main/assets/paramecium/conjugation-provisional.png
          if git diff --cached --quiet; then
            echo "Exact PNG already committed; no duplicate commit."
          else
            git commit -m "assets: stage verified provisional Paramecium conjugation PNG"
            git push origin HEAD:audit/undergraduate-coverage-register-20261114
          fi
