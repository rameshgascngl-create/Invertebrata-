name: Unit I introduction bilingual textbook rendering acceptance
'on':
  push:
    branches: ['feat/plate-pipeline']
    paths:
      - 'native-app/**'
      - '.github/scripts/run-unit1-intro-rendering.sh'
      - '.github/workflows/unit1-intro-book-rendering.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit1-intro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-and-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Record exact source commit
        run: git rev-parse HEAD | tee source-commit.txt
      - name: Compile app and instrumentation; execute complete JVM regression suite
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --stacktrace
      - name: Preserve JVM assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit1-intro-jvm-evidence
          path: |
            source-commit.txt
            native-app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  offline-api34-bilingual:
    needs: kotlin-and-jvm
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Unit I English and Tamil at Android system 100 and 200 percent font
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-unit1-intro-rendering.sh
      - name: Preserve actual display screenshots, instrumentation XML and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit1-intro-api34-100-200-evidence
          path: qa-evidence/unit1-intro/
          if-no-files-found: warn

  release-hold:
    if: always()
    needs: [kotlin-and-jvm, offline-api34-bilingual]
    runs-on: ubuntu-24.04
    steps:
      - name: Record academic and physical-device release hold
        run: |
          echo "Unit I UI assertions do not constitute scientific or Tamil editorial approval."
          echo "Paramecium binary fission and conjugation distinct approved PNGs remain pending."
          echo "Physical-device QA, figure provenance and production signing remain HOLD."
