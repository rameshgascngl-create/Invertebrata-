name: INVERTEBRATA v1.8.8 Production Release Wiring Audit

on:
  push:
    branches:
      - release/v188-production-signing-20260921
    paths:
      - .github/workflows/invertebrata-v188-release.yml
      - .github/workflows/invertebrata-build.yml
      - .github/workflows/v188-production-release-audit.yml

permissions:
  contents: read

jobs:
  source-only-release-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HTML_SHA256: bdb39d4fa1f438c5de83fc9a84ab33905016854c1f641227dbc23063c14c2c46
      EXPECTED_HTML_SIZE: "2393951"
      EXPECTED_TREE_MANIFEST_SHA256: dbcf20925081e3ba67e3a2e4110f8c5fff619d237c262a8bd47d507de3358544

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Static audit of production release workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          python - <<'PY' | tee "$RUNNER_TEMP/evidence/RELEASE_WORKFLOW_STATIC_AUDIT.txt"
          from pathlib import Path

          p = Path(".github/workflows/invertebrata-v188-release.yml")
          s = p.read_text()

          trigger = s.split("permissions:", 1)[0]
          assert "workflow_dispatch:" in trigger
          assert "push:" not in trigger
          assert "pull_request:" not in trigger

          assert "DEVICE_QA_PASS" in s
          assert "debug_apk_sha256" in s
          assert 'refs/heads/main' in s

          assert s.count("reconstruct_v188_accepted_source.py reconstruct") == 2
          assert "reconstruct_v188_accepted_source.py preflight" in s
          assert "ACCEPTED_TRANSFORMS_EXECUTED=$EXPECTED_TRANSFORMS" in s
          assert "SUPERSEDED_TRANSFORMS_EXECUTED=0" in s

          assert "bdb39d4fa1f438c5de83fc9a84ab33905016854c1f641227dbc23063c14c2c46" in s
          assert "dbcf20925081e3ba67e3a2e4110f8c5fff619d237c262a8bd47d507de3358544" in s

          for secret in (
              "secrets.KS_B64",
              "secrets.KS_PASS",
              "secrets.KEY_ALIAS",
              "secrets.KEY_PASS",
              "secrets.INVERTEBRATA_RELEASE_CERT_SHA256",
          ):
              assert secret in s, secret

          assert "Android Debug" in s
          assert "assembleRelease bundleRelease" in s
          assert "assembleDebug" not in s
          assert "debug.keystore" not in s

          assert "INVERTEBRATA-v1.8.8-release.apk" in s
          assert "INVERTEBRATA-v1.8.8-release.aab" in s
          assert "INVERTEBRATA-v1.8.8-SIGNED-PRODUCTION" in s

          assert "Verified using v2 scheme (APK Signature Scheme v2): true" in s
          assert "Verified using v3 scheme (APK Signature Scheme v3): true" in s
          assert "android.permission.INTERNET" in s
          assert "assets/www/index.html" in s
          assert "STORE_SUBMISSION=BLOCKED_PENDING_RELEASE_DEVICE_QA" in s

          legacy = Path(".github/workflows/invertebrata-build.yml").read_text()
          legacy_trigger = legacy.split("permissions:", 1)[0]
          assert "push:" not in legacy_trigger
          assert "workflow_dispatch:" in legacy_trigger
          assert "LEGACY" in legacy.splitlines()[0]

          print("PRODUCTION_TRIGGER_MANUAL_ONLY=PASS")
          print("PHYSICAL_DEVICE_QA_GATE_PRESENT=PASS")
          print("DEBUG_APK_HASH_ACKNOWLEDGEMENT_PRESENT=PASS")
          print("MAIN_BRANCH_GUARD_PRESENT=PASS")
          print("DOUBLE_ACCEPTED_SOURCE_RECONSTRUCTION=PASS")
          print("PERMANENT_CERTIFICATE_PIN_REQUIRED=PASS")
          print("RELEASE_ONLY_BUILD=PASS")
          print("V2_V3_VERIFICATION_PRESENT=PASS")
          print("EMBEDDED_PAYLOAD_HASH_VERIFICATION_PRESENT=PASS")
          print("LEGACY_V187_AUTO_BUILD_RETIRED=PASS")
          print("AUDIT_GRADLE_INVOKED=NO")
          print("AUDIT_APK_GENERATED=NO")
          PY

      - name: Accepted source preflight
        shell: bash
        run: |
          set -euo pipefail
          python ci/reconstruct_v188_accepted_source.py preflight --repo-root "$GITHUB_WORKSPACE" \
            | tee "$RUNNER_TEMP/evidence/PREFLIGHT.txt"
          grep -Fx "PHASE_B1_PREFLIGHT=PASS" "$RUNNER_TEMP/evidence/PREFLIGHT.txt"
          grep -Fx "ACCEPTED_TRANSFORMS_AVAILABLE=20" "$RUNNER_TEMP/evidence/PREFLIGHT.txt"
          grep -Fx "SUPERSEDED_EXECUTABLE_TRANSFORMS=0" "$RUNNER_TEMP/evidence/PREFLIGHT.txt"
          grep -Fx "MATRIX_ROWS=76" "$RUNNER_TEMP/evidence/PREFLIGHT.txt"

      - name: Clean reconstruction Run A
        shell: bash
        run: |
          set -euo pipefail
          python ci/reconstruct_v188_accepted_source.py reconstruct \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/reconstruct-A" \
            --output "$RUNNER_TEMP/evidence/RUN_A.html" \
            | tee "$RUNNER_TEMP/evidence/RUN_A.log"

      - name: Clean reconstruction Run B
        shell: bash
        run: |
          set -euo pipefail
          python ci/reconstruct_v188_accepted_source.py reconstruct \
            --repo-root "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/reconstruct-B" \
            --output "$RUNNER_TEMP/evidence/RUN_B.html" \
            | tee "$RUNNER_TEMP/evidence/RUN_B.log"

      - name: Verify authoritative release input identity
        shell: bash
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/evidence/RUN_A.html" "$RUNNER_TEMP/evidence/RUN_B.html"
          test "$(sha256sum "$RUNNER_TEMP/evidence/RUN_A.html" | awk '{print $1}')" = "$EXPECTED_HTML_SHA256"
          test "$(stat -c %s "$RUNNER_TEMP/evidence/RUN_A.html")" = "$EXPECTED_HTML_SIZE"

          python - <<'PY' | tee "$RUNNER_TEMP/evidence/RELEASE_SOURCE_IDENTITY.txt"
          import hashlib, os
          from pathlib import Path

          rt = Path(os.environ["RUNNER_TEMP"])

          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          def manifest(work):
              roots = [p for p in (Path(work) / "extracted").iterdir() if p.is_dir()]
              assert len(roots) == 1
              root = roots[0]
              rows = []
              for p in sorted(x for x in root.rglob("*") if x.is_file()):
                  rel = p.relative_to(root).as_posix()
                  rows.append((rel, p.stat().st_size, sha(p)))
              text = "".join(f"{h}  {size}  {rel}\n" for rel, size, h in rows)
              return hashlib.sha256(text.encode()).hexdigest(), text, len(rows)

          ma, ta, na = manifest(rt / "reconstruct-A")
          mb, tb, nb = manifest(rt / "reconstruct-B")
          assert ma == mb == os.environ["EXPECTED_TREE_MANIFEST_SHA256"], (ma, mb)
          assert ta == tb
          assert na == nb == 42, (na, nb)

          print("AUTHORITATIVE_HTML_SHA256=" + os.environ["EXPECTED_HTML_SHA256"])
          print("AUTHORITATIVE_HTML_SIZE=" + os.environ["EXPECTED_HTML_SIZE"])
          print("SOURCE_TREE_MANIFEST_SHA256=" + ma)
          print("SOURCE_TREE_FILE_COUNT=" + str(na))
          print("ACCEPTED_TRANSFORMS_EXECUTED=20")
          print("SUPERSEDED_TRANSFORMS_EXECUTED=0")
          print("BYTE_IDENTICAL_RECONSTRUCTION=PASS")
          print("PRODUCTION_RELEASE_WIRING_AUDIT=PASS")
          print("GRADLE_INVOKED=NO")
          print("APK_GENERATED=NO")
          PY

      - name: Upload production-release audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INVERTEBRATA-v1.8.8-PRODUCTION-RELEASE-WIRING-AUDIT
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30
