name: Native R1.6 ciliary textbook acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - native/r16-ciliary-textbook-20261010

permissions:
  contents: read

jobs:
  api34-r16-ciliary-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify R1.6 actual Android normal and Tamil 200% ciliary UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-native-r16-ciliary.sh
      - name: Preserve exact-commit R1.6 screenshot and instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-r16-api34-ciliary-tamil200-evidence
          path: qa-evidence/r16/
          if-no-files-found: warn
