name: Source-based zoology PNG intake (review candidates only)
on:
  push:
    branches:
      - feat/native-textbook-reader-qa
    paths:
      - 'qa-source-intake/**'
      - '.github/workflows/source-based-plate-intake.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-image decoders
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'requests>=2.31,<3'
      - name: Download exact licensed references and convert to separate PNG candidates
        run: python qa-source-intake/fetch_source_pngs.py
      - name: Publish source-by-source provenance and PNG candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoology-source-verified-review-png
          path: qa-source-intake/downloaded-png-review/
          if-no-files-found: error
      - name: Stage only three subject-fitting source images in debug assets
        if: github.ref == 'refs/heads/feat/native-textbook-reader-qa'
        shell: bash
        run: |
          set -euo pipefail
          DEST=native-app/app/src/debug/assets/qa_source_plates
          mkdir -p "$DEST"
          for file in 03_sycon_development.png 09_asterias_dissection.png 10_asterias_larval_reference.png; do
            test -s "qa-source-intake/downloaded-png-review/$file"
            # Existing academically screened PNG bytes are immutable. A fresh
            # Commons thumbnail render must never silently replace the staged
            # version; changes require an explicit reviewed Git commit.
            if [[ ! -s "$DEST/$file" ]]; then
              cp "qa-source-intake/downloaded-png-review/$file" "$DEST/$file"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "QA-only: add three Commons-attributed anatomical PNG reference candidates"
            git push origin HEAD:feat/native-textbook-reader-qa
          fi
