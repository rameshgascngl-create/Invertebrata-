name: Unit IV-V optional anatomical gallery Android acceptance
on:
  push:
    branches: ['feat/plate-pipeline']
    paths:
      - 'native-app/**'
      - '.github/scripts/run-unit45-gallery-qa.sh'
      - '.github/workflows/unit45-gallery-android-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit45-gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-and-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Validate screenshot runner
        run: bash -n .github/scripts/run-unit45-gallery-qa.sh
      - name: Compile Kotlin and instrumentation and run complete JVM suite
        run: gradle -p native-app :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit45-gallery-jvm-evidence
          path: native-app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  api34-offline:
    needs: kotlin-and-jvm
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify in-app raster galleries and return to syllabus in both languages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-unit45-gallery-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit45-gallery-api34-evidence
          path: qa-evidence/unit45-gallery/
          if-no-files-found: warn
